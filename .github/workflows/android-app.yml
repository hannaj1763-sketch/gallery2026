# JJ 갤러리(AGJJ) 안드로이드 앱(APK) 자동 만들기
# - 이 파일을 저장소의 .github/workflows/android-app.yml 로 올리면 GitHub이 앱을 만들어요.
# - 다시 만들고 싶으면: 저장소 > Actions > "Android 앱 만들기" > Run workflow
# - 완성된 앱: https://github.com/hannaj1763-sketch/gallery2026/releases/latest/download/atelier-archive.apk
name: Android 앱 만들기

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android-app.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04   # 안드로이드 도구가 미리 깔린 버전으로 고정
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 앱 뼈대 만들기 (Capacitor)
        run: |
          mkdir app-build && cd app-build
          npm init -y > /dev/null
          npm install @capacitor/core@8.6.2 @capacitor/cli@8.6.2 @capacitor/android@8.6.2
          mkdir www
          echo '<!doctype html><meta charset="utf-8"><title>AGJJ</title>' > www/index.html
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "io.github.hannaj1763.gallery",
            "appName": "AGJJ",
            "webDir": "www",
            "server": { "url": "https://hannaj1763-sketch.github.io/gallery2026/", "cleartext": false },
            "android": { "allowMixedContent": false }
          }
          JSON
          npx cap add android

      - name: 앱 아이콘 만들기 (Robo Bird 작품)
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          import os, shutil
          im = Image.open('artworks/25/image.jpg').convert('RGB')
          w, h = im.size
          s = int(min(w, h) * 0.72); cx, cy = int(w * 0.47), int(h * 0.47)
          icon = im.crop((cx - s // 2, cy - s // 2, cx + s // 2, cy + s // 2)).resize((512, 512), Image.LANCZOS)
          res = 'app-build/android/app/src/main/res'
          for d, px in {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}.items():
              sq = icon.resize((px, px), Image.LANCZOS)
              sq.save(f'{res}/mipmap-{d}/ic_launcher.png')
              mask = Image.new('L', (px, px), 0); ImageDraw.Draw(mask).ellipse((0, 0, px - 1, px - 1), fill=255)
              rd = Image.new('RGBA', (px, px), (0, 0, 0, 0)); rd.paste(sq, (0, 0), mask)
              rd.save(f'{res}/mipmap-{d}/ic_launcher_round.png')
          shutil.rmtree(f'{res}/mipmap-anydpi-v26', ignore_errors=True)
          # 시작 화면: 흰 바탕 가운데에 아이콘
          for d in os.listdir(res):
              p = f'{res}/{d}/splash.png'
              if not os.path.exists(p): continue
              W, H = Image.open(p).size
              k = int(min(W, H) * 0.35)
              bg = Image.new('RGB', (W, H), (255, 255, 255))
              bg.paste(icon.resize((k, k), Image.LANCZOS), ((W - k) // 2, (H - k) // 2))
              bg.save(p)
          PY

      - name: 앱 안에서 저장·보내기·뒤로 가기·광고·캡처 막기·구글 로그인 넣기
        run: |
          cat > app-build/android/app/src/main/java/io/github/hannaj1763/gallery/MainActivity.java <<'JAVA'
          package io.github.hannaj1763.gallery;

          import android.content.ContentValues;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.CancellationSignal;
          import android.provider.MediaStore;
          import android.speech.tts.TextToSpeech;
          import android.speech.RecognitionListener;
          import android.speech.RecognizerIntent;
          import android.speech.SpeechRecognizer;
          import android.Manifest;
          import android.content.pm.PackageManager;
          import java.util.ArrayList;
          import org.json.JSONArray;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import android.view.WindowManager;
          import android.widget.Toast;
          import com.google.android.gms.ads.AdError;
          import com.google.android.gms.ads.AdRequest;
          import com.google.android.gms.ads.FullScreenContentCallback;
          import com.google.android.gms.ads.LoadAdError;
          import com.google.android.gms.ads.MobileAds;
          import com.google.android.gms.ads.RequestConfiguration;
          import com.google.android.gms.ads.rewarded.RewardedAd;
          import com.google.android.gms.ads.rewarded.RewardedAdLoadCallback;
          import org.json.JSONObject;
          import androidx.activity.OnBackPressedCallback;
          import androidx.core.content.ContextCompat;
          import androidx.core.content.FileProvider;
          import androidx.credentials.ClearCredentialStateRequest;
          import androidx.credentials.Credential;
          import androidx.credentials.CredentialManager;
          import androidx.credentials.CredentialManagerCallback;
          import androidx.credentials.CustomCredential;
          import androidx.credentials.GetCredentialRequest;
          import androidx.credentials.GetCredentialResponse;
          import androidx.credentials.exceptions.ClearCredentialException;
          import androidx.credentials.exceptions.GetCredentialCancellationException;
          import androidx.credentials.exceptions.GetCredentialException;
          import com.google.android.libraries.identity.googleid.GetGoogleIdOption;
          import com.google.android.libraries.identity.googleid.GetSignInWithGoogleOption;
          import com.google.android.libraries.identity.googleid.GoogleIdTokenCredential;
          import com.getcapacitor.BridgeActivity;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;
          import java.util.Locale;

          public class MainActivity extends BridgeActivity {

              // 보상형 광고 단위 ID. 지금은 구글이 주는 '시험 광고' ID (실제 돈이 오가지 않음).
              // 출시할 때 AdMob에서 받은 진짜 ID로 바꿔요.
              private static final String REWARDED_ID = "ca-app-pub-3940256099942544/5224354917";

              // 음성 안내: 휴대폰에 들어 있는 한국어 음성(TTS)으로 읽어 줘요
              private TextToSpeech tts;
              private boolean ttsReady = false;

              // 음성 인식(말하기): 휴대폰의 음성 인식으로 듣고 결과를 웹 화면에 알려 줘요 (끝말잇기 마이크)
              private SpeechRecognizer recognizer;
              private String pendingListenLang = null;
              private static final int REQ_MIC = 7001;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  tts = new TextToSpeech(this, st -> {
                      if (st == TextToSpeech.SUCCESS) {
                          int r = tts.setLanguage(Locale.KOREAN);
                          ttsReady = r != TextToSpeech.LANG_MISSING_DATA && r != TextToSpeech.LANG_NOT_SUPPORTED;
                      }
                  });
                  // 광고: 모든 연령 등급(G) 광고만
                  MobileAds.setRequestConfiguration(new RequestConfiguration.Builder()
                          .setMaxAdContentRating(RequestConfiguration.MAX_AD_CONTENT_RATING_G).build());
                  new Thread(() -> MobileAds.initialize(this, status -> {})).start();
                  // 웹 화면에서 window.AtelierApp 으로 저장·보내기를 부를 수 있게 연결
                  WebView web = getBridge().getWebView();
                  web.addJavascriptInterface(new AtelierApp(), "AtelierApp");
                  // 첫 화면이 이 연결보다 먼저 열렸으면 한 번만 다시 불러오기 (그래야 광고·저장 기능이 보여요)
                  web.postDelayed(() -> web.evaluateJavascript("typeof window.AtelierApp", v -> {
                      if (v != null && v.contains("undefined")) web.reload();
                  }), 1500);
                  // 뒤로 가기: 앞 화면이 있으면 그 화면으로, 없으면 앱 닫기
                  getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {
                      @Override
                      public void handleOnBackPressed() {
                          WebView w = getBridge().getWebView();
                          if (w.canGoBack()) {
                              w.goBack();
                          } else {
                              setEnabled(false);
                              getOnBackPressedDispatcher().onBackPressed();
                          }
                      }
                  });
              }

              @Override
              public void onPause() {
                  if (tts != null) tts.stop();
                  super.onPause();
              }

              @Override
              public void onDestroy() {
                  if (tts != null) { tts.stop(); tts.shutdown(); }
                  if (recognizer != null) { recognizer.destroy(); recognizer = null; }
                  super.onDestroy();
              }

              private static byte[] decode(String data) {
                  int i = data.indexOf(',');
                  if (data.startsWith("data:") && i > 0) data = data.substring(i + 1);
                  return Base64.decode(data, Base64.DEFAULT);
              }

              private static String mimeOf(String name) {
                  String n = name.toLowerCase();
                  if (n.endsWith(".png")) return "image/png";
                  if (n.endsWith(".gif")) return "image/gif";
                  if (n.endsWith(".webp")) return "image/webp";
                  if (n.endsWith(".mp4")) return "video/mp4";
                  if (n.endsWith(".webm")) return "video/webm";
                  if (n.endsWith(".wav")) return "audio/wav";
                  if (n.endsWith(".mp3")) return "audio/mpeg";
                  return "image/jpeg";
              }

              public class AtelierApp {
                  @JavascriptInterface
                  public boolean isApp() { return true; }

                  // 몇 번째로 만든 앱인지 (GitHub Actions 실행 번호)
                  @JavascriptInterface
                  public String appBuild() { return "__BUILD__"; }

                  // 사진첩(안드로이드 10 이상)에 바로 저장. 옛 기기는 보내기 창으로 대신.
                  @JavascriptInterface
                  public String saveFile(String data, String name) {
                      try {
                          byte[] bytes = decode(data);
                          String mime = mimeOf(name);
                          boolean video = mime.startsWith("video/"), audio = mime.startsWith("audio/");
                          if (Build.VERSION.SDK_INT >= 29) {
                              ContentValues v = new ContentValues();
                              v.put(MediaStore.MediaColumns.DISPLAY_NAME, name);
                              v.put(MediaStore.MediaColumns.MIME_TYPE, mime);
                              v.put(MediaStore.MediaColumns.RELATIVE_PATH, (audio ? "Music" : video ? "Movies" : "Pictures") + "/Atelier Archive");
                              Uri col = audio ? MediaStore.Audio.Media.EXTERNAL_CONTENT_URI : video ? MediaStore.Video.Media.EXTERNAL_CONTENT_URI : MediaStore.Images.Media.EXTERNAL_CONTENT_URI;
                              Uri uri = getContentResolver().insert(col, v);
                              if (uri == null) throw new Exception("insert failed");
                              try (OutputStream os = getContentResolver().openOutputStream(uri)) { os.write(bytes); }
                              toast(audio ? "음악(Music/Atelier Archive)에 저장했어요" : video ? "동영상을 사진첩에 저장했어요" : "사진첩(Atelier Archive 앨범)에 저장했어요");
                              return "ok";
                          } else {
                              shareBytes(bytes, name);
                              return "shared";
                          }
                      } catch (Exception e) {
                          toast("저장하지 못했어요");
                          return "error:" + e.getMessage();
                      }
                  }

                  // 보상형 광고 보여 주기 → 끝나면 웹의 window.onAtelierAd(tag, "reward" | "closed" | "error") 호출
                  @JavascriptInterface
                  public void showRewardedAd(String tag) {
                      runOnUiThread(() -> loadAndShowAd(tag));
                  }

                  // 관람 중에는 화면 캡처·녹화 막기
                  @JavascriptInterface
                  public void setSecure(boolean on) {
                      runOnUiThread(() -> {
                          if (on) getWindow().addFlags(WindowManager.LayoutParams.FLAG_SECURE);
                          else getWindow().clearFlags(WindowManager.LayoutParams.FLAG_SECURE);
                      });
                  }

                  // 구글 로그인 → 끝나면 웹의 window.onAtelierLogin("ok", 신분증토큰) / ("cancel" | "error", 이유)
                  @JavascriptInterface
                  public void googleSignIn(String webClientId) {
                      runOnUiThread(() -> startGoogleSignIn(webClientId));
                  }

                  // 로그아웃: 다음 로그인 때 계정을 다시 고를 수 있게
                  @JavascriptInterface
                  public void googleSignOut() {
                      runOnUiThread(() -> CredentialManager.create(MainActivity.this).clearCredentialStateAsync(
                              new ClearCredentialStateRequest(), new CancellationSignal(), ContextCompat.getMainExecutor(MainActivity.this),
                              new CredentialManagerCallback<Void, ClearCredentialException>() {
                                  @Override public void onResult(Void v) {}
                                  @Override public void onError(ClearCredentialException e) {}
                              }));
                  }

                  // 카카오톡 등으로 보내기 창 띄우기
                  @JavascriptInterface
                  public String shareFile(String data, String name) {
                      try {
                          shareBytes(decode(data), name);
                          return "ok";
                      } catch (Exception e) {
                          toast("보내기를 열지 못했어요");
                          return "error:" + e.getMessage();
                      }
                  }

                  // 음성으로 읽어 주기 (색 이름·안내 말). rate: 1 = 보통 빠르기
                  @JavascriptInterface
                  public String speak(String text, float rate) {
                      if (tts == null || !ttsReady) return "notready";
                      tts.setSpeechRate(rate > 0 ? rate : 0.9f);
                      tts.speak(text, TextToSpeech.QUEUE_FLUSH, null, "agjj");
                      return "ok";
                  }

                  @JavascriptInterface
                  public void stopSpeak() {
                      if (tts != null) tts.stop();
                  }

                  // 말하기 듣기 시작 (lang 예: "ko-KR"). 결과는 window.onAtelierSpeech(type, text, alts) 로 와요
                  @JavascriptInterface
                  public void listen(String lang) {
                      runOnUiThread(() -> startListen(lang == null || lang.isEmpty() ? "ko-KR" : lang));
                  }

                  @JavascriptInterface
                  public void stopListen() {
                      runOnUiThread(() -> { if (recognizer != null) recognizer.stopListening(); });
                  }

                  @JavascriptInterface
                  public String canListen() {
                      return SpeechRecognizer.isRecognitionAvailable(MainActivity.this) ? "yes" : "no";
                  }

                  // 글(링크)만 카카오톡 등으로 보내기 (아트카드 전시 링크)
                  @JavascriptInterface
                  public String shareText(String text) {
                      try {
                          Intent it = new Intent(Intent.ACTION_SEND);
                          it.setType("text/plain");
                          it.putExtra(Intent.EXTRA_TEXT, text);
                          Intent chooser = Intent.createChooser(it, "보내기");
                          chooser.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          runOnUiThread(() -> startActivity(chooser));
                          return "ok";
                      } catch (Exception e) {
                          toast("보내기를 열지 못했어요");
                          return "error:" + e.getMessage();
                      }
                  }
              }

              private void loadAndShowAd(String tag) {
                  RewardedAd.load(this, REWARDED_ID, new AdRequest.Builder().build(), new RewardedAdLoadCallback() {
                      @Override
                      public void onAdLoaded(RewardedAd ad) {
                          final boolean[] earned = { false };
                          ad.setFullScreenContentCallback(new FullScreenContentCallback() {
                              @Override
                              public void onAdDismissedFullScreenContent() { adResult(tag, earned[0] ? "reward" : "closed"); }
                              @Override
                              public void onAdFailedToShowFullScreenContent(AdError e) { adResult(tag, "error"); }
                          });
                          ad.show(MainActivity.this, item -> earned[0] = true);
                      }
                      @Override
                      public void onAdFailedToLoad(LoadAdError e) { adResult(tag, "error"); }
                  });
              }

              // 1) 휴대폰에 있는 구글 계정 목록(아래에서 올라오는 창) → 2) 안 되면 'Google로 로그인' 전체 화면
              private void startGoogleSignIn(String webClientId) {
                  GetGoogleIdOption opt = new GetGoogleIdOption.Builder()
                          .setFilterByAuthorizedAccounts(false)
                          .setServerClientId(webClientId)
                          .setAutoSelectEnabled(false)
                          .build();
                  requestGoogle(new GetCredentialRequest.Builder().addCredentialOption(opt).build(), webClientId, true);
              }

              private void requestGoogle(GetCredentialRequest req, String webClientId, boolean first) {
                  CredentialManager.create(this).getCredentialAsync(this, req, new CancellationSignal(), ContextCompat.getMainExecutor(this),
                          new CredentialManagerCallback<GetCredentialResponse, GetCredentialException>() {
                              @Override
                              public void onResult(GetCredentialResponse r) {
                                  Credential c = r.getCredential();
                                  if (c instanceof CustomCredential && GoogleIdTokenCredential.TYPE_GOOGLE_ID_TOKEN_CREDENTIAL.equals(c.getType())) {
                                      try {
                                          loginResult("ok", GoogleIdTokenCredential.createFrom(((CustomCredential) c).getData()).getIdToken());
                                      } catch (Exception e) { loginResult("error", "token: " + e.getMessage()); }
                                  } else loginResult("error", "type: " + c.getType());
                              }
                              @Override
                              public void onError(GetCredentialException e) {
                                  String why = e.getClass().getSimpleName() + ": " + e.getMessage();
                                  if (first && !(e instanceof GetCredentialCancellationException)) {
                                      // 계정 목록 방식이 안 되면 전체 화면 방식으로 한 번 더
                                      GetSignInWithGoogleOption opt2 = new GetSignInWithGoogleOption.Builder(webClientId).build();
                                      requestGoogle(new GetCredentialRequest.Builder().addCredentialOption(opt2).build(), webClientId, false);
                                      return;
                                  }
                                  loginResult(e instanceof GetCredentialCancellationException ? "cancel" : "error", why);
                              }
                          });
              }

              private void startListen(String lang) {
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      pendingListenLang = lang;
                      requestPermissions(new String[]{ Manifest.permission.RECORD_AUDIO }, REQ_MIC);
                      return;
                  }
                  if (!SpeechRecognizer.isRecognitionAvailable(this)) { speechEvent("error", "unavailable", null); return; }
                  if (tts != null) tts.stop();
                  if (recognizer != null) { recognizer.destroy(); recognizer = null; }
                  recognizer = SpeechRecognizer.createSpeechRecognizer(this);
                  recognizer.setRecognitionListener(new RecognitionListener() {
                      @Override public void onReadyForSpeech(Bundle b) { speechEvent("ready", "", null); }
                      @Override public void onBeginningOfSpeech() {}
                      @Override public void onRmsChanged(float v) {}
                      @Override public void onBufferReceived(byte[] b) {}
                      @Override public void onEndOfSpeech() { speechEvent("end", "", null); }
                      @Override public void onError(int code) { speechEvent("error", String.valueOf(code), null); }
                      @Override public void onResults(Bundle r) {
                          ArrayList<String> l = r.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                          speechEvent("final", (l != null && !l.isEmpty()) ? l.get(0) : "", l);
                      }
                      @Override public void onPartialResults(Bundle r) {
                          ArrayList<String> l = r.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                          if (l != null && !l.isEmpty()) speechEvent("partial", l.get(0), null);
                      }
                      @Override public void onEvent(int t, Bundle b) {}
                  });
                  Intent it = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                  it.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                  it.putExtra(RecognizerIntent.EXTRA_LANGUAGE, lang);
                  it.putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true);
                  it.putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 3);
                  it.putExtra(RecognizerIntent.EXTRA_CALLING_PACKAGE, getPackageName());
                  try { recognizer.startListening(it); }
                  catch (Exception e) { speechEvent("error", "unavailable", null); }
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode != REQ_MIC) return;
                  String lang = pendingListenLang;
                  pendingListenLang = null;
                  if (grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED && lang != null) startListen(lang);
                  else speechEvent("error", "permission", null);
              }

              private void speechEvent(String type, String text, ArrayList<String> alts) {
                  JSONArray a = new JSONArray();
                  if (alts != null) for (String x : alts) a.put(x);
                  String js = "window.onAtelierSpeech && window.onAtelierSpeech(" + JSONObject.quote(type) + "," + JSONObject.quote(text == null ? "" : text) + "," + a.toString() + ")";
                  runOnUiThread(() -> getBridge().getWebView().evaluateJavascript(js, null));
              }

              private void loginResult(String result, String value) {
                  runOnUiThread(() -> getBridge().getWebView().evaluateJavascript(
                          "window.onAtelierLogin && window.onAtelierLogin(" + JSONObject.quote(result) + "," + JSONObject.quote(value) + ")", null));
              }

              private void adResult(String tag, String result) {
                  runOnUiThread(() -> getBridge().getWebView().evaluateJavascript(
                          "window.onAtelierAd && window.onAtelierAd(" + JSONObject.quote(tag) + "," + JSONObject.quote(result) + ")", null));
              }

              private void shareBytes(byte[] bytes, String name) throws Exception {
                  File dir = new File(getCacheDir(), "share");
                  dir.mkdirs();
                  File f = new File(dir, name);
                  try (FileOutputStream fo = new FileOutputStream(f)) { fo.write(bytes); }
                  Uri uri = FileProvider.getUriForFile(this, getPackageName() + ".fileprovider", f);
                  Intent it = new Intent(Intent.ACTION_SEND);
                  it.setType(mimeOf(name));
                  it.putExtra(Intent.EXTRA_STREAM, uri);
                  it.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                  Intent chooser = Intent.createChooser(it, "보내기");
                  chooser.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_GRANT_READ_URI_PERMISSION);
                  runOnUiThread(() -> startActivity(chooser));
              }

              private void toast(String msg) {
                  runOnUiThread(() -> Toast.makeText(MainActivity.this, msg, Toast.LENGTH_SHORT).show());
              }
          }
          JAVA
          sed -i "s/__BUILD__/$GITHUB_RUN_NUMBER/" app-build/android/app/src/main/java/io/github/hannaj1763/gallery/MainActivity.java
          # 구글 광고(AdMob) 도구 추가
          printf '\ndependencies {\n    implementation "com.google.android.gms:play-services-ads:24.+"\n    implementation "androidx.credentials:credentials:1.3.0"\n    implementation "androidx.credentials:credentials-play-services-auth:1.3.0"\n    implementation "com.google.android.libraries.identity.googleid:googleid:1.1.1"\n}\n' >> app-build/android/app/build.gradle
          # AdMob 앱 ID (지금은 구글 시험용 ID). 출시할 때 진짜 ID로 바꿔요.
          sed -i 's#</application>#    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>\n    </application>#' app-build/android/app/src/main/AndroidManifest.xml
          # 내 주변 전시를 먼저 보여 주려고 위치 권한(대략 위치) 요청
          grep -q ACCESS_COARSE_LOCATION app-build/android/app/src/main/AndroidManifest.xml || sed -i 's#<application#<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <application#' app-build/android/app/src/main/AndroidManifest.xml
          # 끝말잇기 마이크: 마이크 권한 + 휴대폰 음성 인식 서비스 찾기(안드로이드 11 이상)
          grep -q RECORD_AUDIO app-build/android/app/src/main/AndroidManifest.xml || sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <queries>\n        <intent>\n            <action android:name="android.speech.RecognitionService" />\n        </intent>\n    </queries>\n    <application#' app-build/android/app/src/main/AndroidManifest.xml
          cat app-build/android/app/src/main/AndroidManifest.xml

      - name: 같은 서명 키 쓰기 (업데이트 설치가 되도록)
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}   # 앱 서명 열쇠는 Secrets 에만 둬요
        run: |
          mkdir -p ~/.android
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then echo "::error::Secrets 에 ANDROID_KEYSTORE_B64 가 없어요 (Settings > Secrets and variables > Actions)"; exit 1; fi
          printf '%s' "$ANDROID_KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > ~/.android/debug.keystore
          # 안드로이드 도구가 다른 곳의 키를 쓰는 일이 없도록, 앱 설정에 우리 키를 직접 적어 둠 (Firebase SHA-1 = 8E:94:…:82:28)
          cp ~/.android/debug.keystore app-build/android/app/agjj-debug.keystore
          printf '\nandroid {\n    signingConfigs {\n        debug {\n            storeFile file("agjj-debug.keystore")\n            storePassword "android"\n            keyAlias "androiddebugkey"\n            keyPassword "android"\n        }\n    }\n}\n' >> app-build/android/app/build.gradle
          tail -12 app-build/android/app/build.gradle

      - name: APK 만들기
        run: |
          cd app-build/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/atelier-archive.apk"

      - name: 앱 서명 지문(SHA-1) 확인 — Firebase에 넣은 값과 같아야 구글 로그인이 돼요
        continue-on-error: true
        run: |
          SIGNER=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)apksigner
          $SIGNER verify --print-certs atelier-archive.apk | tee certs.txt
          SHA1=$(grep -i "SHA-1 digest" certs.txt | head -1 | awk '{print $NF}' | sed 's/../&:/g;s/:$//' | tr a-f A-F)
          echo "앱 SHA-1: $SHA1"
          echo "SHA1=$SHA1" >> $GITHUB_ENV

      - name: 다운로드 페이지(Releases)에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ github.run_number }}
          name: AGJJ 안드로이드 시험판 ${{ github.run_number }}
          body: "AGJJ(아그짜) 안드로이드 시험판 ${{ github.run_number }}번이에요. atelier-archive.apk 를 휴대폰에서 받아 설치하세요. 앱 서명 SHA-1: ${{ env.SHA1 }}"
          files: atelier-archive.apk
          make_latest: true

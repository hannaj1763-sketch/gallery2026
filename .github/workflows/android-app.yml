# 예성이 갤러리 안드로이드 앱(APK) 자동 만들기
# - 이 파일을 저장소의 .github/workflows/android-app.yml 로 올리면 GitHub이 앱을 만들어요.
# - 다시 만들고 싶으면: 저장소 > Actions > "Android 앱 만들기" > Run workflow
# - 완성된 앱: https://github.com/hannaj1763-sketch/gallery2026/releases/latest/download/atelier-archive.apk
name: Android 앱 만들기

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android-app.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04   # 안드로이드 도구가 미리 깔린 버전으로 고정
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 앱 뼈대 만들기 (Capacitor)
        run: |
          mkdir app-build && cd app-build
          npm init -y > /dev/null
          npm install @capacitor/core@8.6.2 @capacitor/cli@8.6.2 @capacitor/android@8.6.2
          mkdir www
          echo '<!doctype html><meta charset="utf-8"><title>Atelier Archive</title>' > www/index.html
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "io.github.hannaj1763.gallery",
            "appName": "Atelier Archive",
            "webDir": "www",
            "server": { "url": "https://hannaj1763-sketch.github.io/gallery2026/", "cleartext": false },
            "android": { "allowMixedContent": false }
          }
          JSON
          npx cap add android

      - name: 앱 아이콘 만들기 (Robo Bird 작품)
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          import os, shutil
          im = Image.open('artworks/25/image.jpg').convert('RGB')
          w, h = im.size
          s = int(min(w, h) * 0.72); cx, cy = int(w * 0.47), int(h * 0.47)
          icon = im.crop((cx - s // 2, cy - s // 2, cx + s // 2, cy + s // 2)).resize((512, 512), Image.LANCZOS)
          res = 'app-build/android/app/src/main/res'
          for d, px in {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}.items():
              sq = icon.resize((px, px), Image.LANCZOS)
              sq.save(f'{res}/mipmap-{d}/ic_launcher.png')
              mask = Image.new('L', (px, px), 0); ImageDraw.Draw(mask).ellipse((0, 0, px - 1, px - 1), fill=255)
              rd = Image.new('RGBA', (px, px), (0, 0, 0, 0)); rd.paste(sq, (0, 0), mask)
              rd.save(f'{res}/mipmap-{d}/ic_launcher_round.png')
          shutil.rmtree(f'{res}/mipmap-anydpi-v26', ignore_errors=True)
          # 시작 화면: 흰 바탕 가운데에 아이콘
          for d in os.listdir(res):
              p = f'{res}/{d}/splash.png'
              if not os.path.exists(p): continue
              W, H = Image.open(p).size
              k = int(min(W, H) * 0.35)
              bg = Image.new('RGB', (W, H), (255, 255, 255))
              bg.paste(icon.resize((k, k), Image.LANCZOS), ((W - k) // 2, (H - k) // 2))
              bg.save(p)
          PY

      - name: 앱 안에서 저장·보내기·뒤로 가기 기능 넣기
        run: |
          cat > app-build/android/app/src/main/java/io/github/hannaj1763/gallery/MainActivity.java <<'JAVA'
          package io.github.hannaj1763.gallery;

          import android.content.ContentValues;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import android.widget.Toast;
          import androidx.activity.OnBackPressedCallback;
          import androidx.core.content.FileProvider;
          import com.getcapacitor.BridgeActivity;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;

          public class MainActivity extends BridgeActivity {

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  // 웹 화면에서 window.AtelierApp 으로 저장·보내기를 부를 수 있게 연결
                  getBridge().getWebView().addJavascriptInterface(new AtelierApp(), "AtelierApp");
                  // 뒤로 가기: 앞 화면이 있으면 그 화면으로, 없으면 앱 닫기
                  getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {
                      @Override
                      public void handleOnBackPressed() {
                          WebView w = getBridge().getWebView();
                          if (w.canGoBack()) {
                              w.goBack();
                          } else {
                              setEnabled(false);
                              getOnBackPressedDispatcher().onBackPressed();
                          }
                      }
                  });
              }

              private static byte[] decode(String data) {
                  int i = data.indexOf(',');
                  if (data.startsWith("data:") && i > 0) data = data.substring(i + 1);
                  return Base64.decode(data, Base64.DEFAULT);
              }

              private static String mimeOf(String name) {
                  String n = name.toLowerCase();
                  if (n.endsWith(".png")) return "image/png";
                  if (n.endsWith(".gif")) return "image/gif";
                  if (n.endsWith(".webp")) return "image/webp";
                  if (n.endsWith(".mp4")) return "video/mp4";
                  if (n.endsWith(".webm")) return "video/webm";
                  return "image/jpeg";
              }

              public class AtelierApp {
                  @JavascriptInterface
                  public boolean isApp() { return true; }

                  // 사진첩(안드로이드 10 이상)에 바로 저장. 옛 기기는 보내기 창으로 대신.
                  @JavascriptInterface
                  public String saveFile(String data, String name) {
                      try {
                          byte[] bytes = decode(data);
                          String mime = mimeOf(name);
                          boolean video = mime.startsWith("video/");
                          if (Build.VERSION.SDK_INT >= 29) {
                              ContentValues v = new ContentValues();
                              v.put(MediaStore.MediaColumns.DISPLAY_NAME, name);
                              v.put(MediaStore.MediaColumns.MIME_TYPE, mime);
                              v.put(MediaStore.MediaColumns.RELATIVE_PATH, (video ? "Movies" : "Pictures") + "/Atelier Archive");
                              Uri col = video ? MediaStore.Video.Media.EXTERNAL_CONTENT_URI : MediaStore.Images.Media.EXTERNAL_CONTENT_URI;
                              Uri uri = getContentResolver().insert(col, v);
                              if (uri == null) throw new Exception("insert failed");
                              try (OutputStream os = getContentResolver().openOutputStream(uri)) { os.write(bytes); }
                              toast(video ? "동영상을 사진첩에 저장했어요" : "사진첩(Atelier Archive 앨범)에 저장했어요");
                              return "ok";
                          } else {
                              shareBytes(bytes, name);
                              return "shared";
                          }
                      } catch (Exception e) {
                          toast("저장하지 못했어요");
                          return "error:" + e.getMessage();
                      }
                  }

                  // 카카오톡 등으로 보내기 창 띄우기
                  @JavascriptInterface
                  public String shareFile(String data, String name) {
                      try {
                          shareBytes(decode(data), name);
                          return "ok";
                      } catch (Exception e) {
                          toast("보내기를 열지 못했어요");
                          return "error:" + e.getMessage();
                      }
                  }
              }

              private void shareBytes(byte[] bytes, String name) throws Exception {
                  File dir = new File(getCacheDir(), "share");
                  dir.mkdirs();
                  File f = new File(dir, name);
                  try (FileOutputStream fo = new FileOutputStream(f)) { fo.write(bytes); }
                  Uri uri = FileProvider.getUriForFile(this, getPackageName() + ".fileprovider", f);
                  Intent it = new Intent(Intent.ACTION_SEND);
                  it.setType(mimeOf(name));
                  it.putExtra(Intent.EXTRA_STREAM, uri);
                  it.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                  Intent chooser = Intent.createChooser(it, "보내기");
                  chooser.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_GRANT_READ_URI_PERMISSION);
                  runOnUiThread(() -> startActivity(chooser));
              }

              private void toast(String msg) {
                  runOnUiThread(() -> Toast.makeText(MainActivity.this, msg, Toast.LENGTH_SHORT).show());
              }
          }
          JAVA

      - name: 같은 서명 키 쓰기 (업데이트 설치가 되도록)
        run: |
          mkdir -p ~/.android
          echo "" | base64 -d > ~/.android/debug.keystore

      - name: APK 만들기
        run: |
          cd app-build/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/atelier-archive.apk"

      - name: 다운로드 페이지(Releases)에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ github.run_number }}
          name: 안드로이드 시험판 ${{ github.run_number }}
          body: 예성이 갤러리 안드로이드 시험판이에요. atelier-archive.apk 를 휴대폰에서 받아 설치하세요.
          files: atelier-archive.apk
          make_latest: true

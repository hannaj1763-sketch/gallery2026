<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atelier Archive - 아티스트 장예성 갤러리</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", sans-serif; 
      background: #0f1115; 
      color: #f0f2f5; 
      overflow-x: hidden; 
    }
    
    img {
      -webkit-touch-callout: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    header { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; border-bottom: 1px solid rgba(255,255,255,0.08); background: rgba(15,17,21,0.9); position: sticky; top: 0; z-index: 50; backdrop-filter: blur(8px); }
    .nav-tabs { display: flex; gap: 8px; }
    .tab-btn { background: #1a1e26; border: 1px solid rgba(255,255,255,0.1); color: #8a99ad; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.2s; }
    .tab-btn.active { background: #3b82f6; color: #fff; border-color: #3b82f6; }
    
    .view-container { display: none; min-height: calc(100vh - 65px); }
    .view-container.active { display: block; }

    /* 3D 뷰 */
    #view-3d { position: relative; height: calc(100vh - 65px); }
    #canvas3d { width: 100%; height: 100%; display: block; }
    .hint-3d { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); padding: 8px 16px; border-radius: 20px; font-size: 13px; color: #cbd5e1; pointer-events: none; text-align: center; }

    /* 도록 뷰 */
    #view-archive { max-width: 1200px; margin: 0 auto; padding: 32px 20px; }
    .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; margin-top: 24px; }
    .art-card { background: #161a22; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; overflow: hidden; cursor: pointer; transition: transform 0.2s; position: relative; }
    .art-card:hover { transform: translateY(-4px); }
    
    .thumb-wrapper { position: relative; width: 100%; height: 260px; background: #0b0d11; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    .art-thumb { width: 100%; height: 100%; object-fit: cover; display: block; }
    .thumb-watermark {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-20deg);
      font-size: 26px;
      font-weight: 800;
      color: rgba(255, 255, 255, 0.28);
      pointer-events: none;
      white-space: nowrap;
      text-shadow: 0 0 8px rgba(0,0,0,0.8);
      letter-spacing: 3px;
    }

    .art-info { padding: 16px; }
    .art-title { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
    .art-meta { font-size: 12px; color: #8a99ad; margin-bottom: 8px; }
    .art-note { font-size: 13px; color: #cbd5e1; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    /* 심층 뷰어 모달 */
    .viewer-modal { display: none; position: fixed; inset: 0; background: rgba(5,6,8,0.97); z-index: 100; flex-direction: column; }
    .viewer-modal.active { display: flex; }
    .viewer-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .viewer-counter { font-size: 12px; color: #3b82f6; font-weight: 600; margin-left: 8px; }
    
    .viewer-body { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; padding: 10px 20px; overflow: hidden; }
    
    /* 확대 뷰어 이미지 및 중앙 J.J 워터마크 */
    .viewer-img-container { position: relative; display: inline-flex; align-items: center; justify-content: center; }
    .viewer-img { max-height: 52vh; max-width: 85vw; object-fit: contain; box-shadow: 0 10px 40px rgba(0,0,0,0.8); }
    .viewer-watermark {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-25deg);
      font-size: clamp(36px, 8vw, 64px);
      font-weight: 900;
      color: rgba(255, 255, 255, 0.28);
      pointer-events: none;
      white-space: nowrap;
      text-shadow: 0 0 14px rgba(0, 0, 0, 0.9);
      letter-spacing: 6px;
    }
    
    /* 좌우 이동 버튼 */
    .nav-arrow { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.12); color: #fff; border: none; width: 44px; height: 44px; border-radius: 50%; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); transition: background 0.2s; z-index: 10; }
    .nav-arrow:hover { background: rgba(59,130,246,0.8); }
    .nav-arrow.prev { left: 16px; }
    .nav-arrow.next { right: 16px; }

    .viewer-footer { padding: 16px 24px; background: rgba(15,17,21,0.95); border-top: 1px solid rgba(255,255,255,0.08); max-height: 38vh; overflow-y: auto; }
    .lang-switcher { display: flex; gap: 6px; margin-bottom: 12px; justify-content: center; flex-wrap: wrap; }
    .lang-btn { background: #222733; border: 1px solid rgba(255,255,255,0.1); color: #94a3b8; padding: 4px 12px; border-radius: 14px; font-size: 12px; cursor: pointer; }
    .lang-btn.active { background: #3b82f6; color: #fff; border-color: #3b82f6; }
    .note-content { font-size: 14px; color: #e2e8f0; line-height: 1.6; max-width: 720px; margin: 0 auto; text-align: center; }

    #loadingText { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #8a99ad; font-size: 14px; z-index: 200; pointer-events: none; }
  </style>
</head>
<body>

  <div id="loadingText">작품 보관함 동기화 및 큐레이팅 중...</div>

  <header>
    <div style="font-weight: 700; font-size: 16px; letter-spacing: -0.5px;">Atelier Archive</div>
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchView

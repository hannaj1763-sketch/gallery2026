HTML
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atelier Archive - 글로벌 전시관</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", sans-serif; background: #0f1115; color: #f0f2f5; overflow-x: hidden; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; border-bottom: 1px solid rgba(255,255,255,0.08); background: rgba(15,17,21,0.9); position: sticky; top: 0; z-index: 50; backdrop-filter: blur(8px); }
    .nav-tabs { display: flex; gap: 8px; }
    .tab-btn { background: #1a1e26; border: 1px solid rgba(255,255,255,0.1); color: #8a99ad; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.2s; }
    .tab-btn.active { background: #3b82f6; color: #fff; border-color: #3b82f6; }
    .btn-primary { background: #3b82f6; color: #fff; border: none; padding: 8px 16px; border-radius: 20px; font-size: 13px; cursor: pointer; font-weight: 600; }
    
    .view-container { display: none; min-height: calc(100vh - 65px); }
    .view-container.active { display: block; }

    /* 3D 뷰 */
    #view-3d { position: relative; height: calc(100vh - 65px); }
    #canvas3d { width: 100%; height: 100%; display: block; }
    .hint-3d { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); padding: 8px 16px; border-radius: 20px; font-size: 13px; color: #cbd5e1; pointer-events: none; text-align: center; }

    /* 도록 뷰 */
    #view-archive { max-width: 1200px; margin: 0 auto; padding: 32px 20px; }
    .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; margin-top: 24px; }
    .art-card { background: #161a22; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; overflow: hidden; cursor: pointer; transition: transform 0.2s; }
    .art-card:hover { transform: translateY(-4px); }
    .art-thumb { width: 100%; height: 260px; object-fit: cover; background: #0b0d11; display: block; }
    .art-info { padding: 16px; }
    .art-title { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
    .art-meta { font-size: 12px; color: #8a99ad; margin-bottom: 8px; }
    .art-note { font-size: 13px; color: #cbd5e1; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    /* 심층 뷰어 모달 & 언어 선택 바 */
    .viewer-modal { display: none; position: fixed; inset: 0; background: rgba(5,6,8,0.97); z-index: 100; flex-direction: column; }
    .viewer-modal.active { display: flex; }
    .viewer-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .viewer-body { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; overflow: hidden; }
    .viewer-img { max-height: 55vh; max-width: 90vw; object-fit: contain; box-shadow: 0 10px 40px rgba(0,0,0,0.8); }
    .viewer-footer { padding: 20px 24px; background: rgba(15,17,21,0.95); border-top: 1px solid rgba(255,255,255,0.08); max-height: 35vh; overflow-y: auto; }
    
    .lang-switcher { display: flex; gap: 6px; margin-bottom: 12px; justify-content: center; flex-wrap: wrap; }
    .lang-btn { background: #222733; border: 1px solid rgba(255,255,255,0.1); color: #94a3b8; padding: 4px 12px; border-radius: 14px; font-size: 12px; cursor: pointer; }
    .lang-btn.active { background: #3b82f6; color: #fff; border-color: #3b82f6; }
    .note-content { font-size: 14px; color: #e2e8f0; line-height: 1.6; max-width: 720px; margin: 0 auto; text-align: center; }

    /* 등록 모달 */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(5px); }
    .modal.active { display: flex; }
    .modal-content { background: #161a22; border-radius: 16px; max-width: 600px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 24px; border: 1px solid rgba(255,255,255,0.1); }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 13px; color: #8a99ad; margin-bottom: 6px; }
    .form-group input, .form-group textarea { width: 100%; background: #0f1115; border: 1px solid rgba(255,255,255,0.15); color: #fff; padding: 10px 14px; border-radius: 8px; font-size: 14px; }
  </style>
</head>
<body>

  <header>
    <div style="font-weight: 700; font-size: 16px; letter-spacing: -0.5px;">Atelier Archive</div>
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchView('3d')">3D 가상 갤러리</button>
      <button class="tab-btn" onclick="switchView('archive')">도록 (연작)</button>
    </div>
    <button class="btn-primary" onclick="openUploadModal()">+ 종이 그림 등록</button>
  </header>

  <!-- 3D 뷰 -->
  <div id="view-3d" class="view-container active">
    <canvas id="canvas3d"></canvas>
    <div class="hint-3d">벽면 작품을 클릭하면 5개 국어 작가 노트를 볼 수 있습니다</div>
  </div>

  <!-- 도록 뷰 -->
  <div id="view-archive" class="view-container">
    <h2 style="font-size: 20px; font-weight: 600;">작품 도록 & 아카이브</h2>
    <div id="artGrid" class="gallery-grid"></div>
  </div>

  <!-- 다국어 지원 심층 뷰어 모달 -->
  <div id="viewerModal" class="viewer-modal">
    <div class="viewer-header">
      <div id="viewerTitle" style="font-weight: 600; font-size: 16px;">작품명</div>
      <button onclick="closeViewer()" style="background:none; border:none; color:#fff; font-size:24px; cursor:pointer;">&times;</button>
    </div>
    <div class="viewer-body">
      <img id="viewerImg" class="viewer-img" src="" alt="작품">
    </div>
    <div class="viewer-footer">
      <div id="viewerMeta" style="text-align:center; font-size:12px; color:#94a3b8; margin-bottom:12px;"></div>
      
      <!-- 5개 국어 전환 탭 -->
      <div class="lang-switcher">
        <button class="lang-btn active" onclick="changeLang('ko')">한국어</button>
        <button class="lang-btn" onclick="changeLang('en')">English</button>
        <button class="lang-btn" onclick="changeLang('ja')">日本語</button>
        <button class="lang-btn" onclick="changeLang('zh')">中文</button>
        <button class="lang-btn" onclick="changeLang('es')">Español</button>
      </div>

      <div id="viewerNote" class="note-content"></div>
    </div>
  </div>

  <!-- 작품 등록 모달 -->
  <div id="uploadModal" class="modal">
    <div class="modal-content">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h3 style="font-size: 18px;">새 종이 그림 등록</h3>
        <button onclick="closeUploadModal()" style="background:none; border:none; color:#fff; font-size:20px; cursor:pointer;">&times;</button>
      </div>
      <div class="form-group">
        <label>종이 원화 사진 (스마트폰 촬영)</label>
        <input type="file" id="fileInput" accept="image/*" onchange="previewImage(event)">
      </div>
      <div class="form-group">
        <label>작품 제목 (기본 한글)</label>
        <input type="text" id="artTitleInput" placeholder="예: 무제 (침묵의 결)">
      </div>
      <div class="form-group">
        <label>사용 재료 및 규격</label>
        <input type="text" id="artMetaInput" placeholder="예: 한지 위 목탄, 210 x 297 mm, 2026">
      </div>
      <div class="form-group">
        <label>작가 메모 (한국어)</label>
        <textarea id="noteKo" rows="2" placeholder="한국어 단상"></textarea>
      </div>
      <div class="form-group">
        <label>작가 메모 (English - 영어)</label>
        <textarea id="noteEn" rows="2" placeholder="English artist note"></textarea>
      </div>
      <div class="form-group">
        <label>작가 메모 (日本語 - 일본어)</label>
        <textarea id="noteJa" rows="2" placeholder="日本語の作家ノート"></textarea>
      </div>
      <div class="form-group">
        <label>작가 메모 (中文 - 중국어)</label>
        <textarea id="noteZh" rows="2" placeholder="中文创作陈述"></textarea>
      </div>
      <div class="form-group">
        <label>작가 메모 (Español - 스페인어)</label>
        <textarea id="noteEs" rows="2" placeholder="Declaración del artista en español"></textarea>
      </div>
      <button class="btn-primary" style="width:100%; padding:12px; margin-top:10px;" onclick="saveArtwork()">전시관에 등록</button>
    </div>
  </div>

  <script>
    // 5개 국어 기본 샘플 데이터 구조
    let artworks = [
      {
        id: 1,
        title: "새벽의 선 (Line of Dawn)",
        meta: "코튼지 위 목탄, 흑연 | 180 x 260 mm, 2026",
        src: "https://images.unsplash.com/photo-1579783902614-a3fb3927b675?auto=format&fit=crop&w=1000&q=80",
        notes: {
          ko: "새벽빛이 종이 결 위로 번져나가는 순간의 호흡을 거친 목탄 가루로 기록했습니다.",
          en: "Recorded the breath of dawn light spreading across the paper's texture with rough charcoal dust.",
          ja: "夜明けの光が紙のテクスチャに広がっていく瞬間の息遣いを、荒い木炭の粉で刻みました。",
          zh: "用粗糙的木炭粉记录了晨曦在纸面纹理上晕染开来的呼吸瞬间。",
          es: "Capturé el aliento de la luz del alba extendiéndose sobre la textura del papel con polvo de carbón."
        }
      },
      {
        id: 2,
        title: "침묵의 잔향",
        meta: "아르쉬 수채지 위 잉크 | 210 x 297 mm, 2026",
        src: "https://images.unsplash.com/photo-1579783900882-c0d3dad7b119?auto=format&fit=crop&w=1000&q=80",
        notes: {
          ko: "물의 농담에 따라 번져가는 먹의 시간성을 기록한 소품 연작입니다.",
          en: "A series capturing the temporality of ink spreading according to the gradient of water.",
          ja: "水の濃淡に従って滲み出る墨の時間性を記録した小品連作です。",
          zh: "记录了水墨随水分浓淡自然晕开的时间性小品系列。",
          es: "Una serie que registra la temporalidad de la tinta extendiéndose con el gradiente de agua."
        }
      }
    ];

    let currentSelectedArt = null;
    let currentImageData = null;

    function renderArchive() {
      const grid = document.getElementById('artGrid');
      grid.innerHTML = artworks.map(art => `
        <div class="art-card" onclick="openViewerById(${art.id})">
          <img src="${art.src}" class="art-thumb" alt="${art.title}">
          <div class="art-info">
            <div class="art-title">${art.title}</div>
            <div class="art-meta">${art.meta}</div>
            <div class="art-note">${art.notes.ko || art.notes.en}</div>
          </div>
        </div>
      `).join('');
    }

    function switchView(mode) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.view-container').forEach(v => v.classList.remove('active'));
      if(mode === '3d') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('view-3d').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('view-archive').classList.add('active');
        renderArchive();
      }
    }

    function openViewerById(id) {
      const art = artworks.find(a => a.id === id);
      if (!art) return;
      currentSelectedArt = art;

      document.getElementById('viewerImg').src = art.src;
      document.getElementById('viewerTitle').innerText = art.title;
      document.getElementById('viewerMeta').innerText = art.meta;
      
      changeLang('ko');
      document.getElementById('viewerModal').classList.add('active');
    }

    function changeLang(lang) {
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
      const activeBtn = Array.from(document.querySelectorAll('.lang-btn')).find(b => b.innerText.toLowerCase().includes(lang) || (lang==='ko'&&b.innerText==='한국어') || (lang==='ja'&&b.innerText==='日本語') || (lang==='zh'&&b.innerText==='中文') || (lang==='es'&&b.innerText==='Español'));
      if (activeBtn) activeBtn.classList.add('active');

      if (currentSelectedArt && currentSelectedArt.notes) {
        document.getElementById('viewerNote').innerText = currentSelectedArt.notes[lang] || currentSelectedArt.notes.ko || '메모가 작성되지 않았습니다.';
      }
    }

    function closeViewer() {
      document.getElementById('viewerModal').classList.remove('active');
    }

    function openUploadModal() { document.getElementById('uploadModal').classList.add('active'); }
    function closeUploadModal() { document.getElementById('uploadModal').classList.remove('active'); }

    function previewImage(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => { currentImageData = event.target.result; };
      reader.readAsDataURL(file);
    }

    function saveArtwork() {
      const title = document.getElementById('artTitleInput').value || '무제';
      const meta = document.getElementById('artMetaInput').value || '종이 위 원화, 2026';
      const src = currentImageData || 'https://images.unsplash.com/photo-1579783902614-a3fb3927b675?auto=format&fit=crop&w=1000&q=80';

      const notes = {
        ko: document.getElementById('noteKo').value || '',
        en: document.getElementById('noteEn').value || '',
        ja: document.getElementById('noteJa').value || '',
        zh: document.getElementById('noteZh').value || '',
        es: document.getElementById('noteEs').value || ''
      };

      const newArt = { id: Date.now(), title, meta, src, notes };
      artworks.unshift(newArt);
      renderArchive();
      closeUploadModal();
      alert('5개 국어 메모와 함께 작품이 등록되었습니다.');
    }

    // 3D 가상 갤러리 Three.js
    let scene, camera, renderer, paintings = [];
    function init3D() {
      const container = document.getElementById('view-3d');
      const canvas = document.getElementById('canvas3d');
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0f1115);

      camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
      camera.position.set(0, 1.6, 4);

      renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setSize(container.clientWidth, container.clientHeight);

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
      scene.add(ambientLight);
      const pointLight = new THREE.PointLight(0xffffff, 0.8, 15);
      pointLight.position.set(0, 3, 2);
      scene.add(pointLight);

      const floor = new THREE.Mesh(new THREE.PlaneGeometry(12, 12), new THREE.MeshStandardMaterial({ color: 0x161a22, roughness: 0.8 }));
      floor.rotation.x = -Math.PI / 2;
      scene.add(floor);

      const backWall = new THREE.Mesh(new THREE.PlaneGeometry(12, 4), new THREE.MeshStandardMaterial({ color: 0x1f242d }));
      backWall.position.set(0, 2, -4);
      scene.add(backWall);

      const loader = new THREE.TextureLoader();
      artworks.forEach((art, index) => {
        loader.load(art.src, (texture) => {
          const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 2.0), new THREE.MeshBasicMaterial({ map: texture }));
          mesh.position.set((index - 0.5) * 2.8, 2, -3.95);
          mesh.userData = art;
          paintings.push(mesh);
          scene.add(mesh);
        });
      });

      let isDragging = false, prevX = 0;
      canvas.addEventListener('mousedown', (e) => { isDragging = true; prevX = e.clientX; });
      window.addEventListener('mouseup', () => { isDragging = false; });
      canvas.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        camera.rotation.y += (e.clientX - prevX) * 0.003;
        prevX = e.clientX;
      });

      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();
      canvas.addEventListener('click', (e) => {
        const rect = canvas.getBoundingClientRect();
        mouse.x = ((e.clientX - rect.left) / canvas.clientWidth) * 2 - 1;
        mouse.y = -((e.clientY - rect.top) / canvas.clientHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(paintings);
        if (intersects.length > 0) {
          openViewerById(intersects[0].object.userData.id);
        }
      });

      function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
      }
      animate();

      window.addEventListener('resize', () => {
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
      });
    }

    window.onload = () => {
      renderArchive();
      init3D();
    };
  </script>
</body>
</html>

<script>
// =====================================================================
// 🫧 JJ 꾸욱꾸욱 — 가입 없이 바로! 말랑이 늘리기 · 왁뿌 볼 부수기 · 도파민 키캡
//  · 그림: thumbs/index.json + thumbs/NN.webp
//  · 기록: localStorage 'agjj_malang_v1' { n, day, dayN, paid, art, mode }
//  · 하루 처음 50번 꾹 하면 💧 물감 +1 (갤러리로 돌아가면 받아요)
// =====================================================================

const $ = id => document.getElementById(id);
const KEY = 'agjj_malang_v1', todayS = () => { const d = new Date(); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; };
let S = {}; try { S = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
S.n = S.n || 0; if (S.day !== todayS()) { S.day = todayS(); S.dayN = 0; S.paid = false; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
let tT = 0; function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tT); tT = setTimeout(() => t.classList.remove('on'), 1600); }
function count(k = 1) {
  S.n += k; S.dayN = (S.dayN || 0) + k; $('cnt').textContent = `꾹 ${S.n.toLocaleString()}번`;
  if (!S.paid && S.dayN >= 50) { S.paid = true; try { localStorage.setItem('agjj_pending_paint', String((parseInt(localStorage.getItem('agjj_pending_paint') || '0', 10) || 0) + 1)); } catch (e) {} toast('💧 오늘의 꾹 50번! 물감 +1'); }
  if (S.n % 10 === 0) save();
}
$('cnt').textContent = `꾹 ${S.n.toLocaleString()}번`;
// 📳 진동 (설정에서 끌 수 있어요) — 앱은 진동 권한이 있는 새 버전부터 울려요
if (S.vib === undefined) S.vib = true;
const buzz = ms => { if (!S.vib) return; try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

// ---------------- 🔊 ASMR 소리 (직접 합성) ----------------
const vibBtn = () => { $('vibT').textContent = S.vib ? '📳 진동 ON' : '📴 진동 OFF'; };
$('vibT').onclick = () => { S.vib = !S.vib; save(); vibBtn(); buzz(40); };
vibBtn();
let AC = null;
function ac() { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); return AC; }
function noise(dur, f, q, vol, type = 'bandpass', at = 0) {
  const a = ac(), n = a.sampleRate * dur | 0, b = a.createBuffer(1, n, a.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3);
  const s = a.createBufferSource(); s.buffer = b; const fl = a.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q;
  const g = a.createGain(); g.gain.value = vol; s.connect(fl).connect(g).connect(a.destination); s.start(a.currentTime + at);
}
function tone(f0, f1, dur, vol, type = 'sine', at = 0) {
  const a = ac(), t = a.currentTime + at, o = a.createOscillator(), g = a.createGain(); o.type = type;
  o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur); o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur);
}
const SND = {
  stretch(k) { try { tone(160 + k * 120, 120 + k * 80, .09, .07); noise(.05, 900 + k * 600, 3, .05); } catch (e) {} },
  boing(k) { try { tone(90 + k * 60, 260 + k * 160, .18, .16, 'sine'); tone(260 + k * 160, 140, .25, .08, 'triangle', .12); } catch (e) {} },
  crunch() { try { for (let i = 0; i < 5; i++) noise(.035 + Math.random() * .04, 1800 + Math.random() * 3500, 1.5, .28, 'bandpass', i * .018 + Math.random() * .01); noise(.08, 400, 1, .12, 'lowpass'); } catch (e) {} },
  clack(p) { try { noise(.018, 4200 + p * 300, 2, .45, 'highpass'); tone(1600 + p * 90, 900, .03, .08, 'square'); noise(.06, 700, 2, .14, 'bandpass', .012); } catch (e) {} },
};

// ---------------- 🖼 그림 ----------------
let WORKS = [], IMGS = {};
function img(id) {
  if (IMGS[id]) return IMGS[id];
  const im = new Image(); im.src = `thumbs/${id}.webp`; IMGS[id] = im; return im;
}
const rndW = () => WORKS[Math.random() * WORKS.length | 0];

// ---------------- 캔버스 ----------------
const cv = $('cv'), cx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() { DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; cx.setTransform(DPR, 0, 0, DPR, 0, 0); layoutBalls(); blobReset(); }
let mode = 'blob';

// =====================================================================
// 🍡 말랑이 — 테두리 점 40개가 용수철로 이어져 있어요. 잡아당기면 늘어나고, 놓으면 띠용~

}

    }

  for (let i = 0; i < BN; i++) { const p = B.pts[i], q = B.pts[(i + 1) % BN], o = B.pts[(i + BN - 1) % BN]; p.vx += ((q.x + o.x) / 2 - p.x) * .05; p.vy += ((q.y + o.y) / 2 - p.y) * .05; }
  for (const p of B.pts) { p.x += p.vx; p.y += p.vy; }
}
function blobPath() {
  const P = B.pts; cx.beginPath();
  const m0 = { x: (P[BN - 1].x + P[0].x) / 2, y: (P[BN - 1].y + P[0].y) / 2 }; cx.moveTo(m0.x, m0.y);
  for (let i = 0; i < BN; i++) { const p = P[i], q = P[(i + 1) % BN]; cx.quadraticCurveTo(p.x, p.y, (p.x + q.x) / 2, (p.y + q.y) / 2); }
  cx.closePath();
}
function blobDraw() {
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9; for (const p of B.pts) { x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x); y0 = Math.min(y0, p.y); y1 = Math.max(y1, p.y); }
  const w = x1 - x0, h = y1 - y0;
  // 그림자
  cx.save(); cx.fillStyle = 'rgba(80,40,90,.12)'; cx.beginPath(); cx.ellipse(B.c.x, y1 + 22, w * .42, 14, 0, 0, 7); cx.fill(); cx.restore();
  blobPath();
  const g = cx.createRadialGradient(x0 + w * .35, y0 + h * .3, 10, B.c.x, B.c.y, Math.max(w, h) * .7);
  g.addColorStop(0, '#fff'); g.addColorStop(.5, '#fbcfe8'); g.addColorStop(1, '#f9a8d4');
  cx.fillStyle = g; cx.fill();
  cx.lineWidth = 4; cx.strokeStyle = '#3b2a45'; cx.stroke();
  // 그림이 말랑이 모양 따라 쭉 늘어나요
  const im = B.art && img(B.art.id);

    cx.save(); blobPath(); cx.clip();
    const iw = im.naturalWidth, ih = im.naturalHeight, k = Math.max(w / iw, h / ih) * 1.02;
    cx.drawImage(im, (x0 + x1) / 2 - iw * k / 2 + (iw * k - w) * 0, (y0 + y1) / 2 - ih * k / 2, iw * k, ih * k);
    // 가장자리는 말랑한 분홍빛으로 (실리콘 느낌)
    const v = cx.createRadialGradient((x0 + x1) / 2, (y0 + y1) / 2, Math.min(w, h) * .32, (x0 + x1) / 2, (y0 + y1) / 2, Math.max(w, h) * .62);

  const happy = B.grabs.size > 0;

    if (happy) { cx.lineWidth = 5; cx.strokeStyle = '#2d1e24'; cx.beginPath(); cx.moveTo(ex - 9, ey + 2); cx.lineTo(ex, ey - 6); cx.lineTo(ex + 9, ey + 2); cx.stroke(); }
    else { cx.beginPath(); cx.ellipse(ex, ey, 9, 11, 0, 0, 7); cx.fill(); cx.fillStyle = '#fff'; cx.beginPath(); cx.arc(ex - 3, ey - 4, 3.2, 0, 7); cx.fill(); }

}
function blobMove(e) { const g = B.grabs.get(e.pointerId); if (!g) return; const lim = B.R * 1.6; g.dx = Math.max(-lim, Math.min(lim, (e.clientX - g.sx) * .9)); g.dy = Math.max(-lim, Math.min(lim, (e.clientY - g.sy) * .9)); }

// =====================================================================
// 🔮 왁뿌 볼 — 톡 치면 와작! 부서지고 금방 다시 생겨요 (무한)
// =====================================================================
let balls = [], shards = [], flashes = [], shake = 0;
const BALLC = ['#f472b6', '#a78bfa', '#38bdf8', '#facc15', '#34d399', '#fb923c'];
function layoutBalls() {
  const cols = 3, rows = 4, top = 150, bot = H - 150, cw = W / cols, ch = (bot - top) / rows;

    const k = j * cols + i, o = old[k];
    balls.push({ x: cw * (i + .5), y: top + ch * (j + .5), r, c: o ? o.c : BALLC[k % BALLC.length], art: o ? o.art : null, s: 1, dead: 0, wob: 0 });
  }

function ballArt() { for (const b of balls) if (!b.art && WORKS.length) b.art = rndW(); }
function smash(b) {
  if (b.dead) return;
  b.dead = 1; SND.crunch(); buzz([35, 15, 25, 15, 45]); count();
  flashes.push({ x: b.x, y: b.y, r: b.r, life: 1, c: b.c }); shake = 7;
  const N = 14;
  for (let i = 0; i < N; i++) {
    const a = i / N * Math.PI * 2 + Math.random() * .3, sp = 3 + Math.random() * 6;

  }
  for (let i = 0; i < 16; i++) shards.push({ x: b.x, y: b.y, vx: (Math.random() - .5) * 10, vy: (Math.random() - .8) * 9, r: 2 + Math.random() * 3, crumb: 1, c: '#fff', life: 1 });

}
function ballDraw() {
  if (shake > .3) { cx.save(); cx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake); shake *= .82; } else shake = 0;
  const shook = shake > 0;
  for (let i = flashes.length - 1; i >= 0; i--) {

    cx.strokeStyle = f.c; cx.lineWidth = 6 * f.life; cx.beginPath(); cx.arc(f.x, f.y, rr, 0, 7); cx.stroke();
    // 쩍! 금 가는 선
    cx.strokeStyle = '#fff'; cx.lineWidth = 3 * f.life; cx.lineCap = 'round';
    for (let k = 0; k < 8; k++) { const a = k / 8 * Math.PI * 2 + .3; cx.beginPath(); cx.moveTo(f.x + Math.cos(a) * rr * .4, f.y + Math.sin(a) * rr * .4); cx.lineTo(f.x + Math.cos(a) * rr * 1.15, f.y + Math.sin(a) * rr * 1.15); cx.stroke(); }
    cx.restore();
  }
  for (const b of balls) {
    if (b.dead) continue;
    b.s += (1 - b.s) * .18; b.wob *= .85; const r = b.r * (b.s + Math.sin(b.wob * 9) * b.wob * .08);
    cx.save(); cx.translate(b.x, b.y);
    cx.fillStyle = 'rgba(80,40,90,.12)'; cx.beginPath(); cx.ellipse(0, r * 1.05, r * .8, r * .16, 0, 0, 7); cx.fill();
    const g = cx.createRadialGradient(-r * .35, -r * .4, r * .1, 0, 0, r);
    g.addColorStop(0, '#fff'); g.addColorStop(.35, b.c); g.addColorStop(1, shade(b.c, -40));
    cx.fillStyle = g; cx.beginPath(); cx.arc(0, 0, r, 0, 7); cx.fill();
    const im = b.art && img(b.art.id);
    if (im && im.complete && im.naturalWidth) { cx.save(); cx.beginPath(); cx.arc(0, 0, r * .62, 0, 7); cx.clip(); cx.globalAlpha = .9; cx.drawImage(im, -r * .62, -r * .62, r * 1.24, r * 1.24); cx.restore(); cx.strokeStyle = 'rgba(255,255,255,.85)'; cx.lineWidth = 3; cx.beginPath(); cx.arc(0, 0, r * .62, 0, 7); cx.stroke(); }
    // 왁스 코팅 광택
    cx.fillStyle = 'rgba(255,255,255,.75)'; cx.beginPath(); cx.ellipse(-r * .38, -r * .5, r * .26, r * .12, -.6, 0, 7); cx.fill();
    cx.fillStyle = 'rgba(255,255,255,.5)'; cx.beginPath(); cx.arc(r * .45, r * .35, r * .07, 0, 7); cx.fill();
    cx.lineWidth = 3; cx.strokeStyle = '#3b2a45'; cx.beginPath(); cx.arc(0, 0, r, 0, 7); cx.stroke();
    cx.restore();
  }
  for (let i = shards.length - 1; i >= 0; i--) {
    const s = shards[i]; s.vy += .45; s.x += s.vx; s.y += s.vy; s.vx *= .985; s.life -= .022;
    if (s.life <= 0 || s.y > H + 40) { shards.splice(i, 1); continue; }
    cx.save(); cx.globalAlpha = Math.min(1, s.life * 1.5); cx.translate(s.x, s.y);
    if (s.crumb) { cx.fillStyle = s.c; cx.beginPath(); cx.arc(0, 0, s.r, 0, 7); cx.fill(); }
    else {
      s.rot += s.vr; cx.rotate(s.rot); cx.fillStyle = s.c; cx.strokeStyle = '#3b2a45'; cx.lineWidth = 2;
      cx.beginPath(); cx.moveTo(-s.r, -s.r * .7); cx.lineTo(s.r, -s.r * .4); cx.lineTo(s.r * .3, s.r); cx.closePath(); cx.fill(); cx.stroke();
      cx.fillStyle = 'rgba(255,255,255,.6)'; cx.beginPath(); cx.moveTo(-s.r * .6, -s.r * .5); cx.lineTo(s.r * .3, -s.r * .35); cx.lineTo(-s.r * .2, 0); cx.closePath(); cx.fill();
    }
    cx.restore();
  }
  if (shook) cx.restore();
}
function shade(hex, a) { const n = parseInt(hex.slice(1), 16); const f = v => Math.max(0, Math.min(255, v + a)); return `rgb(${f(n >> 16)},${f(n >> 8 & 255)},${f(n & 255)})`; }
let ballDrag = false;
function ballAt(x, y) { for (const b of balls) if (!b.dead && Math.hypot(x - b.x, y - b.y) < b.r) return b; return null; }

// =====================================================================
// 🌀 그림 슬라임 — 문지르면 찰방찰방 결이 생기고, 계속 문지르면 바풍이 부풀다가 팡!
// =====================================================================
let slimeRipples = [], slimeSeeds = [], bubbleR = 0, bubbleTarget = 0, slimeArt = null, slimeLast = 0;
for (let i = 0; i < 18; i++) slimeSeeds.push({ x: Math.random(), y: .18 + Math.random() * .6, r: 5 + Math.random() * 5, a: Math.random() * 6.28, c: ['#3b2a45', '#f472b6', '#facc15', '#38bdf8'][i % 4] });
function slimeSwirl(x, y, power = 1) {
  slimeRipples.push({ x, y, r: 12, maxR: 110 + power * 60, life: 1 });
  if (slimeRipples.length > 24) slimeRipples.shift();
  const BIG = Math.min(W, H) * .36;
  bubbleTarget = Math.min(BIG * 1.06, bubbleTarget + 14 * power);
  if (bubbleTarget >= BIG) {   // 바풍 팡!
    SND.boing(1); SND.crunch(); buzz([40, 20, 60]); count(3);
    pop('🫧 팡!!', W / 2 - 30, H * .45);
    for (let i = 0; i < 18; i++) { const a = i / 18 * Math.PI * 2; slimeRipples.push({ x: W / 2 + Math.cos(a) * 60, y: H * .48 + Math.sin(a) * 60, r: 10, maxR: 140, life: 1 }); }
    bubbleR = bubbleTarget = 0;
  } else {
    const now = Date.now(); if (now - slimeLast > 70) { slimeLast = now; SND.stretch(Math.min(1, power * .6)); buzz(12); }
  }
}
function slimeDraw() {
  const t = Date.now() * .002;
  // 1) 슬라임 + JJ 그림 마블링 (천천히 일렁여요)
  const im = slimeArt && img(slimeArt.id);
  if (im && im.complete && im.naturalWidth) {
    cx.save(); cx.globalAlpha = .38; const s = Math.max(W, H) * .85;
    cx.translate(W / 2 + Math.sin(t) * 12, H * .48 + Math.cos(t * .8) * 12); cx.rotate(Math.sin(t * .4) * .08);
    cx.drawImage(im, -s / 2, -s / 2, s, s); cx.restore();
  }
  // 2) 손가락 결 (물결)
  for (let i = slimeRipples.length - 1; i >= 0; i--) {
    const rp = slimeRipples[i]; rp.r += (rp.maxR - rp.r) * .12; rp.life -= .022;
    if (rp.life <= 0) { slimeRipples.splice(i, 1); continue; }
    cx.save();
    cx.strokeStyle = `rgba(255,255,255,${rp.life * .75})`; cx.lineWidth = 14 * rp.life; cx.beginPath(); cx.arc(rp.x, rp.y, rp.r, 0, 7); cx.stroke();
    cx.strokeStyle = `rgba(244,114,182,${rp.life * .25})`; cx.lineWidth = 24 * rp.life; cx.beginPath(); cx.arc(rp.x + 6, rp.y + 6, rp.r * .85, 0, 7); cx.stroke();
    cx.restore();
  }
  // 3) 슬라임 속 파츠 (수박씨·글리터)
  for (const sd of slimeSeeds) {
    const sx = (sd.x + Math.sin(t + sd.a) * .03) * W, sy = (sd.y + Math.cos(t * .9 + sd.a) * .03) * H;
    cx.save(); cx.translate(sx, sy); cx.rotate(sd.a + Math.sin(t) * .3);
    cx.fillStyle = sd.c; cx.beginPath(); cx.ellipse(0, 0, sd.r, sd.r * .55, 0, 0, 7); cx.fill();
    cx.fillStyle = 'rgba(255,255,255,.6)'; cx.beginPath(); cx.arc(-sd.r * .3, -sd.r * .15, 1.8, 0, 7); cx.fill();
    cx.restore();
  }
  // 4) 가운데 바풍 (슬라임 버블)
  bubbleTarget *= .992; bubbleR += (bubbleTarget - bubbleR) * .15;
  if (bubbleR > 8) {
    const bx = W / 2, by = H * .48; cx.save();
    const bg = cx.createRadialGradient(bx - bubbleR * .3, by - bubbleR * .3, bubbleR * .1, bx, by, bubbleR);
    bg.addColorStop(0, 'rgba(255,255,255,.85)'); bg.addColorStop(.6, 'rgba(244,114,182,.28)'); bg.addColorStop(1, 'rgba(255,255,255,.75)');
    cx.fillStyle = bg; cx.beginPath(); cx.arc(bx, by, bubbleR, 0, 7); cx.fill();
    cx.lineWidth = 3; cx.strokeStyle = 'rgba(255,255,255,.9)'; cx.stroke();
    cx.fillStyle = 'rgba(255,255,255,.8)'; cx.beginPath(); cx.ellipse(bx - bubbleR * .35, by - bubbleR * .38, bubbleR * .24, bubbleR * .11, -.6, 0, 7); cx.fill();
    cx.restore();
  }
}

// =====================================================================
// ⌨️ 도파민 키캡 — 딸깍딸깍! 그림 키캡 12개
// =====================================================================
const KEYC = ['#b9a6d6', '#f9a8d4', '#93c5fd', '#fcd34d', '#86efac', '#fdba74'];
const LETTERS = ['J', 'J', 'G', 'A', 'L', 'L', 'E', 'R', 'Y', '♥', '★', '!'];
function buildKeys() {
  const box = $('keys'); box.innerHTML = '';
  for (let i = 0; i < 12; i++) {
    const w = WORKS.length ? WORKS[(i * 7 + (S.kseed || 0)) % WORKS.length] : null;
    const b = document.createElement('button'); b.className = 'kc'; b.style.setProperty('--sd', KEYC[i % KEYC.length]);
    b.innerHTML = `<div class="cap"><span>${LETTERS[i]}</span>${w ? `<img src="thumbs/${w.id}.webp" alt="" draggable="false">` : `<b style="font-size:30px">${LETTERS[i]}</b>`}</div>`;
    const dn = e => { e.preventDefault(); b.classList.add('down'); SND.clack(i % 6); buzz(22); count(); if (Math.random() < .12) pop(['✨', '💖', '⭐', '🎨', '💧'][Math.random() * 5 | 0], e.clientX, e.clientY - 20); };
    const upk = () => b.classList.remove('down');
    b.addEventListener('pointerdown', dn); b.addEventListener('pointerup', upk); b.addEventListener('pointerleave', upk); b.addEventListener('pointercancel', upk);
    box.appendChild(b);
  }
}
function pop(t, x, y) { const d = document.createElement('div'); d.className = 'pop'; d.textContent = t; d.style.left = (x - 14) + 'px'; d.style.top = y + 'px'; document.body.appendChild(d); setTimeout(() => d.remove(), 750); }

// ---------------- 모드 · 도구 ----------------
const SUBS = { blob: '말랑이를 양옆으로 쭉~ 늘려 보세요 (두 손가락도 돼요)', ball: '톡! 치면 와작 · 쓱 문질러도 부서져요', key: '딸깍딸깍 눌러 보세요 · 여러 개 동시에도!', slime: '손가락으로 쓱쓱 문지르면 바풍이 부풀다가 팡!' };
function setMode(m) {
  mode = m; S.mode = m; save();
  document.body.className = 'm-' + m + (document.body.classList.contains('in-app') ? ' in-app' : '');
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.m === m));
  $('sub').textContent = SUBS[m];
  const t = $('tools');
  if (m === 'blob') t.innerHTML = '<button class="pill" id="tLucky">🔮 그림 뽑기</button><a class="pill" href="squishy.html">🫧 3D 말랑이</a>';
  else if (m === 'ball') t.innerHTML = '<button class="pill" id="tAll">💥 한꺼번에 와작</button>';
  else if (m === 'key') t.innerHTML = '<button class="pill" id="tKeys">🎲 키캡 그림 바꾸기</button>';
  else t.innerHTML = '<button class="pill" id="tSlimeArt">🔮 슬라임 그림 바꾸기</button>';
  const SA = $('tSlimeArt'); if (SA) SA.onclick = () => { if (WORKS.length) { slimeArt = rndW(); slimeSwirl(W / 2, H / 2, 1.2); } };
  const L = $('tLucky'); if (L) L.onclick = luckyBlob;
  const A = $('tAll'); if (A) A.onclick = () => balls.forEach((b, i) => setTimeout(() => smash(b), i * 45));
  const K = $('tKeys'); if (K) K.onclick = () => { S.kseed = (S.kseed || 0) + 1 + (Math.random() * 20 | 0); save(); buildKeys(); SND.clack(3); };
}
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { setMode(b.dataset.m); try { ac(); } catch (e) {} });
function luckyBlob() {
  if (!WORKS.length) return;
  if (window.JJLucky) JJLucky.open({ title: '말랑이 그림 뽑기', sub: '캡슐 속 그림이 말랑이 속으로 쏙!', balls: 3, goText: '🔮 그림 뽑기!', okText: '이 그림으로 말랑!',
    prizes: () => { const w = rndW(); return { icon: '🍡', title: w.title, desc: '말랑이 속에 이 그림이 들어가요!', art: w.id, label: '럭키볼에서 나온 그림은', say: w.title + '!', data: w }; },
    onPick: p => { B.art = p.data; S.art = p.data.id; save(); SND.boing(.6); } });
  else { B.art = rndW(); }
}

// ---------------- 입력 ----------------
cv.addEventListener('pointerdown', e => {
  try { ac(); } catch (er) {} try { cv.setPointerCapture(e.pointerId); } catch (er) {}
  if (mode === 'blob') blobDown(e);
  else if (mode === 'ball') { ballDrag = true; const b = ballAt(e.clientX, e.clientY); if (b) smash(b); }
  else if (mode === 'slime') { ballDrag = true; slimeSwirl(e.clientX, e.clientY, 1); count(); }
});
cv.addEventListener('pointermove', e => {
  if (mode === 'blob') blobMove(e);
  else if (mode === 'ball' && ballDrag) { const b = ballAt(e.clientX, e.clientY); if (b) smash(b); }
  else if (mode === 'slime' && ballDrag) { if (Math.random() < .45) slimeSwirl(e.clientX, e.clientY, .55); }
});
const upAll = e => { if (mode === 'blob') blobUp(e); ballDrag = false; };
cv.addEventListener('pointerup', upAll); cv.addEventListener('pointercancel', upAll);

// ---------------- 루프 ----------------
function loop() {
  cx.clearRect(0, 0, W, H);
  if (mode === 'blob') { blobStep(); blobDraw(); }
  else if (mode === 'ball') ballDraw();
  else if (mode === 'slime') slimeDraw();
  requestAnimationFrame(loop);
}
addEventListener('resize', resize);
resize(); setMode(S.mode || 'blob'); loop();
(async () => {
  try { const r = await fetch('thumbs/index.json', { cache: 'no-cache' }); const j = await r.json(); WORKS = (j.works || []).map(w => ({ id: w.id, title: w.title || ('JJ의 그림 ' + w.id) })); } catch (e) {}
  if (!WORKS.length) return;
  B.art = WORKS.find(w => w.id === S.art) || rndW(); slimeArt = rndW(); ballArt(); buildKeys();
})();
addEventListener('pagehide', save); document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
</script>
<script src="paint-icon.js"></script>
</body>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>예성이 갤러리 - 간편 업로드 스튜디오</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif; background: #0f1115; color: #f0f2f5; padding: 20px; line-height: 1.5; }
    .card { background: #161a22; border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 20px; max-width: 480px; margin: 0 auto; }
    h1 { font-size: 18px; font-weight: 700; margin-bottom: 20px; text-align: center; color: #3b82f6; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 13px; color: #8a99ad; margin-bottom: 6px; font-weight: 500; }
    input[type="text"], input[type="password"], textarea, select { width: 100%; background: #0b0d11; border: 1px solid rgba(255,255,255,0.15); color: #fff; padding: 12px; border-radius: 10px; font-size: 14px; outline: none; }
    input:focus, textarea:focus { border-color: #3b82f6; }
    .file-drop { border: 2px dashed rgba(59,130,246,0.4); background: rgba(59,130,246,0.03); border-radius: 12px; padding: 20px; text-align: center; cursor: pointer; }
    .btn-submit { width: 100%; background: #3b82f6; color: #fff; border: none; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 10px; }
    .btn-submit:disabled { background: #374151; color: #9ca3af; cursor: not-allowed; }
    .status-msg { margin-top: 15px; font-size: 13px; text-align: center; min-height: 20px; white-space: pre-line; }
    .hint { font-size: 12px; color: #6b7a8f; margin-top: 6px; }
    .link-btn { background: none; border: none; color: #8a99ad; font-size: 12px; text-decoration: underline; cursor: pointer; margin-top: 6px; padding: 4px 0; }
    .editor { display: none; margin-top: 12px; }
    .editor canvas { display: block; width: 100%; border-radius: 10px; background: #0b0d11; touch-action: none; }
    .tool-row { display: flex; gap: 8px; margin-top: 10px; }
    .tool-btn { flex: 1; background: #232a36; color: #e5e9f0; border: 1px solid rgba(255,255,255,0.12); padding: 10px 4px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .tool-btn:active { background: #2f3a4b; }
    .gallery-link { display: block; text-align: center; margin-top: 14px; color: #8a99ad; font-size: 13px; }
  </style>
</head>
<body>

<div class="card">
  <h1>🎨 간편 작품 등록 스튜디오</h1>

  <!-- 1회성 토큰 설정 (한 번 저장하면 이 휴대폰 브라우저에 기억됨) -->
  <div class="form-group" id="tokenArea">
    <label for="ghToken">GitHub 토큰 (github_pat_... 또는 ghp_...)</label>
    <input type="password" id="ghToken" placeholder="토큰을 입력하면 이 기기에 저장됩니다" autocomplete="off">
    <button type="button" class="link-btn" onclick="forgetToken()">이 기기에서 토큰 지우기</button>
  </div>

  <div class="form-group">
    <label>그림 사진 선택 (스마트폰 촬영 / 갤러리)</label>
    <div class="file-drop" onclick="document.getElementById('artFile').click()">
      <span id="fileLabel">📷 여기를 눌러 사진을 선택하세요</span>
      <input type="file" id="artFile" accept="image/*" style="display:none" onchange="handleFile(event)">
    </div>
    <!-- [추가] 사진 돌리기·자르기 -->
    <div class="editor" id="editor">
      <canvas id="editCanvas"></canvas>
      <div class="tool-row">
        <button type="button" class="tool-btn" onclick="rotateBy(-90)">↺ 왼쪽으로</button>
        <button type="button" class="tool-btn" onclick="rotateBy(90)">↻ 오른쪽으로</button>
        <button type="button" class="tool-btn" onclick="resetCrop()">⤢ 자르기 취소</button>
      </div>
      <div class="hint">네 모서리의 동그라미를 끌어서 자를 곳을 정하세요. 네모 안을 끌면 위치가 옮겨져요.</div>
    </div>
    <div class="hint" id="sizeHint"></div>
  </div>

  <div class="form-group">
    <label for="artTitle">작품 제목</label>
    <input type="text" id="artTitle" placeholder="예: 탁자 위의 요구르트">
  </div>

  <div class="form-group">
    <label for="artDate">제작 연월 (YYYY-MM)</label>
    <input type="text" id="artDate" placeholder="예: 2026-11" inputmode="numeric">
  </div>

  <div class="form-group">
    <label for="artMeta">재료 및 정보</label>
    <input type="text" id="artMeta" placeholder="예: 스케치북 위 색연필 | 2026년 11월">
  </div>

  <div class="form-group">
    <label for="artNoteKo">예성이의 생각 및 메모 (한국어)</label>
    <textarea id="artNoteKo" rows="3" placeholder="예성이가 그림을 그릴 때 한 말이나 생각을 편하게 적어주세요"></textarea>
  </div>

  <button class="btn-submit" id="submitBtn" onclick="uploadArtwork()">전시관에 즉시 발행</button>
  <div class="status-msg" id="statusMsg"></div>
  <a class="gallery-link" href="./">← 전시관으로 가기</a>
</div>

<script>
  const OWNER = 'hannaj1763-sketch';
  const REPO = 'gallery2026';
  const MAX_SIDE = 1600;          // [개선] 사진 긴 변을 1600px로 줄여서 올림 (전시관 로딩이 빨라짐)
  const JPEG_QUALITY = 0.86;
  const GALLERY_CACHE_KEY = 'atelier_artworks_v2';  // 전시관이 작품 목록을 10분간 기억하는 저장 이름


  // 오늘 연월을 기본값으로
  function thisMonth() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  }

  // 저장된 토큰 자동 불러오기
  window.onload = () => {
    const savedToken = localStorage.getItem('gh_art_token');
    if (savedToken) {
      document.getElementById('ghToken').value = savedToken;
      document.getElementById('tokenArea').style.opacity = '0.5';
    }
    document.getElementById('artDate').value = thisMonth();
  };

  function forgetToken() {
    localStorage.removeItem('gh_art_token');
    document.getElementById('ghToken').value = '';
    document.getElementById('tokenArea').style.opacity = '1';
    alert('이 기기에 저장된 토큰을 지웠어요.');
  }

  // ===== [추가] 사진 돌리기·자르기 =====
  let srcImg = null;            // 원본 사진
  let rot = 0;                  // 돌린 각도 0, 90, 180, 270
  let crop = { x: 0, y: 0, w: 1, h: 1 };   // 돌린 사진 기준 자를 영역 (0~1 비율)
  let drag = null;
  const MIN_CROP = 0.08;

  const rotW = () => (rot % 180 === 0 ? srcImg.naturalWidth : srcImg.naturalHeight);
  const rotH = () => (rot % 180 === 0 ? srcImg.naturalHeight : srcImg.naturalWidth);

  // 사진을 돌린 상태로 그리기 (scale: 화면 크기에 맞춘 배율)
  function drawRotated(ctx, scale) {
    const W = srcImg.naturalWidth, H = srcImg.naturalHeight;
    ctx.save();
    ctx.scale(scale, scale);
    if (rot === 90) { ctx.translate(H, 0); ctx.rotate(Math.PI / 2); }
    else if (rot === 180) { ctx.translate(W, H); ctx.rotate(Math.PI); }
    else if (rot === 270) { ctx.translate(0, W); ctx.rotate(-Math.PI / 2); }
    ctx.drawImage(srcImg, 0, 0);
    ctx.restore();
  }

  // 편집 화면 그리기
  function drawEditor() {
    if (!srcImg) return;
    const cv = document.getElementById('editCanvas');
    const boxW = cv.parentElement.clientWidth;
    const maxH = Math.round(window.innerHeight * 0.6);
    const s = Math.min(boxW / rotW(), maxH / rotH());
    const dpr = window.devicePixelRatio || 1;
    const cw = Math.round(rotW() * s), ch = Math.round(rotH() * s);
    cv.style.width = cw + 'px'; cv.style.height = ch + 'px'; cv.style.margin = '0 auto';
    cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
    const ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawRotated(ctx, s);
    // 잘려 나갈 부분은 어둡게
    const x = crop.x * cw, y = crop.y * ch, w = crop.w * cw, h = crop.h * ch;
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(0, 0, cw, y);
    ctx.fillRect(0, y + h, cw, ch - y - h);
    ctx.fillRect(0, y, x, h);
    ctx.fillRect(x + w, y, cw - x - w, h);
    // 테두리와 3등분 선
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.strokeRect(x, y, w, h);
    ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 1; i < 3; i++) {
      ctx.moveTo(x + w * i / 3, y); ctx.lineTo(x + w * i / 3, y + h);
      ctx.moveTo(x, y + h * i / 3); ctx.lineTo(x + w, y + h * i / 3);
    }
    ctx.stroke();
    // 모서리 손잡이
    ctx.fillStyle = '#3b82f6'; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
    [[x, y], [x + w, y], [x, y + h], [x + w, y + h]].forEach(([px, py]) => {
      ctx.beginPath(); ctx.arc(px, py, 9, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    });
  }

  // 손가락 위치 → 0~1 비율
  function pointerPos(e) {
    const r = document.getElementById('editCanvas').getBoundingClientRect();
    return { px: e.clientX - r.left, py: e.clientY - r.top, u: (e.clientX - r.left) / r.width, v: (e.clientY - r.top) / r.height, W: r.width, H: r.height };
  }

  function onDown(e) {
    if (!srcImg) return;
    const p = pointerPos(e);
    const corners = { tl: [crop.x, crop.y], tr: [crop.x + crop.w, crop.y], bl: [crop.x, crop.y + crop.h], br: [crop.x + crop.w, crop.y + crop.h] };
    let hit = null, best = 30;   // 손가락으로 잡기 쉽게 30px 안이면 모서리로 인정
    for (const k in corners) {
      const d = Math.hypot(corners[k][0] * p.W - p.px, corners[k][1] * p.H - p.py);
      if (d < best) { best = d; hit = k; }
    }
    if (!hit && p.u > crop.x && p.u < crop.x + crop.w && p.v > crop.y && p.v < crop.y + crop.h) hit = 'move';
    if (!hit) return;
    drag = { mode: hit, u: p.u, v: p.v, start: { ...crop } };
    e.target.setPointerCapture(e.pointerId);
    e.preventDefault();
  }

  function onMove(e) {
    if (!drag) return;
    const p = pointerPos(e);
    const du = p.u - drag.u, dv = p.v - drag.v, s0 = drag.start;
    const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));
    let x0 = s0.x, y0 = s0.y, x1 = s0.x + s0.w, y1 = s0.y + s0.h;
    if (drag.mode === 'move') {
      const nx = clamp(s0.x + du, 0, 1 - s0.w), ny = clamp(s0.y + dv, 0, 1 - s0.h);
      crop = { x: nx, y: ny, w: s0.w, h: s0.h };
    } else {
      if (drag.mode[1] === 'l') x0 = clamp(s0.x + du, 0, x1 - MIN_CROP);
      if (drag.mode[1] === 'r') x1 = clamp(x1 + du, x0 + MIN_CROP, 1);
      if (drag.mode[0] === 't') y0 = clamp(s0.y + dv, 0, y1 - MIN_CROP);
      if (drag.mode[0] === 'b') y1 = clamp(y1 + dv, y0 + MIN_CROP, 1);
      crop = { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
    }
    drawEditor();
  }

  function onUp() {
    if (!drag) return;
    drag = null;
    updateSizeHint();
  }

  // 90도씩 돌리기 (자를 영역도 같이 돌아감)
  function rotateBy(deg) {
    if (!srcImg) return;
    const c = crop;
    if (deg === 90) crop = { x: 1 - (c.y + c.h), y: c.x, w: c.h, h: c.w };
    else crop = { x: c.y, y: 1 - (c.x + c.w), w: c.h, h: c.w };
    rot = (rot + deg + 360) % 360;
    drawEditor();
    updateSizeHint();
  }

  function resetCrop() {
    crop = { x: 0, y: 0, w: 1, h: 1 };
    drawEditor();
    updateSizeHint();
  }

  // 돌리고 자른 결과를 긴 변 1600px JPG로 만들기
  function renderFinal() {
    const cx = crop.x * rotW(), cy = crop.y * rotH();
    const cw = crop.w * rotW(), chh = crop.h * rotH();
    const s = Math.min(1, MAX_SIDE / Math.max(cw, chh));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(cw * s));
    c.height = Math.max(1, Math.round(chh * s));
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#ffffff';            // 투명 PNG도 흰 종이 배경으로
    ctx.fillRect(0, 0, c.width, c.height);
    ctx.translate(-cx * s, -cy * s);
    drawRotated(ctx, s);
    return { dataUrl: c.toDataURL('image/jpeg', JPEG_QUALITY), w: c.width, h: c.height };
  }

  let originalKB = 0;
  function updateSizeHint() {
    const hint = document.getElementById('sizeHint');
    if (!srcImg) { hint.innerText = ''; return; }
    const w = Math.round(crop.w * rotW()), h = Math.round(crop.h * rotH());
    const s = Math.min(1, MAX_SIDE / Math.max(w, h));
    hint.innerText = `올릴 크기: ${Math.round(w * s)}×${Math.round(h * s)}px (원본 ${originalKB}KB)`;
  }

  function handleFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    document.getElementById('fileLabel').innerText = `선택 완료: ${file.name} (다시 누르면 다른 사진 선택)`;
    originalKB = Math.round(file.size / 1024);
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      srcImg = img; rot = 0; crop = { x: 0, y: 0, w: 1, h: 1 };
      document.getElementById('editor').style.display = 'block';
      drawEditor();
      updateSizeHint();
    };
    img.onerror = () => {
      srcImg = null;
      document.getElementById('editor').style.display = 'none';
      document.getElementById('sizeHint').innerText = '이 사진 형식은 열 수 없어요. 다른 사진(JPG/PNG)을 골라 주세요.';
    };
    img.src = url;
  }

  (function setupEditor() {
    const cv = document.getElementById('editCanvas');
    cv.addEventListener('pointerdown', onDown);
    cv.addEventListener('pointermove', onMove);
    cv.addEventListener('pointerup', onUp);
    cv.addEventListener('pointercancel', onUp);
    window.addEventListener('resize', drawEditor);
  })();

  // GitHub 응답을 이해하기 쉬운 말로
  async function explainError(res, step) {
    let detail = '';
    try { detail = (await res.json()).message || ''; } catch (e) {}
    const map = {
      401: '토큰이 맞지 않거나 만료됐어요. GitHub에서 토큰을 새로 만들어 넣어 주세요.',
      403: '토큰에 이 저장소 쓰기 권한이 없어요. 토큰 권한(Contents: Read and write)을 확인해 주세요.',
      404: '저장소를 찾지 못했어요. 토큰이 gallery2026 저장소를 선택했는지 확인해 주세요.',
      409: '저장소가 잠시 바빠요. 1분 뒤 다시 시도해 주세요.',
      422: '같은 이름의 파일이 이미 있어요. 다시 시도하면 새 번호로 올라가요.'
    };
    return `${step} 실패 (${res.status})\n${map[res.status] || detail || '잠시 뒤 다시 시도해 주세요.'}`;
  }

  async function putFile(token, path, base64, message) {
    return fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`, {
      method: 'PUT',
      headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json', 'Accept': 'application/vnd.github+json' },
      body: JSON.stringify({ message, content: base64 })
    });
  }

  async function uploadArtwork() {
    const token = document.getElementById('ghToken').value.trim();
    const title = document.getElementById('artTitle').value.trim();
    let date = document.getElementById('artDate').value.trim() || thisMonth();
    const meta = document.getElementById('artMeta').value.trim();
    const noteKo = document.getElementById('artNoteKo').value.trim();

    if (!token) return alert('GitHub 토큰을 입력해 주세요.');
    if (!srcImg) return alert('그림 사진을 선택해 주세요.');
    if (!title) return alert('작품 제목을 입력해 주세요.');
    // [개선] 2026.11, 2026-1 같은 입력도 2026-11, 2026-01로 맞춤 (전시 순서가 날짜로 정해지기 때문)
    const m = date.match(/^(\d{4})\D*(\d{1,2})$/);
    if (!m || +m[2] < 1 || +m[2] > 12) return alert('제작 연월을 2026-11 형식으로 적어 주세요.');
    date = `${m[1]}-${m[2].padStart(2, '0')}`;

    localStorage.setItem('gh_art_token', token);
    const finalImg = renderFinal();                 // [추가] 돌리고 자른 그림으로 올림
    const selectedBase64 = finalImg.dataUrl.split(',')[1];
    const fileExt = 'jpg';

    const btn = document.getElementById('submitBtn');
    const msg = document.getElementById('statusMsg');
    btn.disabled = true;
    btn.innerText = '전시관에 등록하는 중...';
    msg.style.color = '#3b82f6';
    msg.innerText = '깃허브 저장소와 통신 중입니다...';

    try {
      // 1. [개선] 새 번호 = 지금 있는 가장 큰 번호 + 1 (중간 폴더를 지워도 번호가 겹치지 않음)
      const listRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/artworks`, {
        headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github+json' }
      });
      if (!listRes.ok) throw new Error(await explainError(listRes, '작품 목록 확인'));
      const items = await listRes.json();
      const nums = items.filter(i => i.type === 'dir').map(i => parseInt(i.name, 10)).filter(n => !isNaN(n));
      const nextNum = String((nums.length ? Math.max(...nums) : 1) + 1).padStart(2, '0');
      const folderPath = `artworks/${nextNum}`;

      // 2. 이미지 먼저 올리기 (실패하면 메모도 올리지 않아 빈 폴더가 생기지 않음)
      msg.innerText = '원화 이미지 전송 중...';
      const imgRes = await putFile(token, `${folderPath}/image.${fileExt}`, selectedBase64, `Add image for ${folderPath}`);
      if (!imgRes.ok) throw new Error(await explainError(imgRes, '이미지 올리기'));

      // 3. note.json 구성 (기본 5개국어 템플릿 포함)
      const noteData = {
        title: title,
        date: date,
        meta: meta || date,
        notes: {
          ko: noteKo || "작품 설명이 등록되었습니다.",
          en: `Artwork: ${title}. Created by artist Yesung Jang.`,
          ja: `作品：${title}。作家チャン・イェソンの作品です。`,
          zh: `作品：《${title}》。张艺成艺术家的画作。`,
          es: `Obra: ${title}. Creada por el artista Yesung Jang.`
        }
      };
      msg.innerText = '작품 메모 생성 중...';
      const noteContentBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(noteData, null, 2))));
      const noteRes = await putFile(token, `${folderPath}/note.json`, noteContentBase64, `Add note for ${folderPath}`);
      if (!noteRes.ok) throw new Error(await explainError(noteRes, '작품 메모 올리기'));

      // 4. [개선] 이 휴대폰의 전시관 기억(10분)을 지워서 새 작품이 바로 보이게
      try { localStorage.removeItem(GALLERY_CACHE_KEY); } catch (e) {}

      msg.style.color = '#10b981';
      msg.innerText = `🎉 [${title}] 작품이 ${nextNum}번 액자로 전시관에 등록되었습니다!\n1~2분 뒤 전시관과 숏폼에 나타나요.`;
      alert('성공적으로 등록되었습니다! 1~2분 뒤 전시관에 나타납니다.');

      // 폼 초기화
      document.getElementById('artTitle').value = '';
      document.getElementById('artMeta').value = '';
      document.getElementById('artNoteKo').value = '';
      document.getElementById('artFile').value = '';
      document.getElementById('editor').style.display = 'none';
      document.getElementById('fileLabel').innerText = '📷 여기를 눌러 사진을 선택하세요';
      document.getElementById('sizeHint').innerText = '';
      srcImg = null;

    } catch (err) {
      msg.style.color = '#ef4444';
      msg.innerText = '등록하지 못했어요.\n' + err.message;
    } finally {
      btn.disabled = false;
      btn.innerText = '전시관에 즉시 발행';
    }
  }
</script>

</body>
</html>

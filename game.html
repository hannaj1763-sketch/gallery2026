<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1030">
<title>J.J 아트퐁</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<!--
  J.J 아트퐁: JJ의 작품으로 하는 3개 맞추기 퍼즐
  - 같은 그림 3개 이상을 가로·세로로 맞추면 터져요. 60초 동안 최고 점수에 도전!
  - 4개 이상 맞추면 +2초, 연달아 터지면 콤보 점수
  - 1단계 보석 = 무료 로비 작품 6점. My Collection에 작품을 담을수록 ✨레어 보석이 늘어 2·3·4단계가 열려요.
  - 앱: 한 판에 💧 1개 (갤러리의 🎮 Art Pang에서 단계를 고르고 페인트를 내면 입장권이 생겨요)
  - 단계 목표 점수를 넘기면 💧 1개를 돌려받아요 (갤러리로 돌아가면 들어가요)
  - 웹: 1단계만 무료로 해 볼 수 있어요
-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { height: 100%; overflow: hidden; background: #1a1030; color: #fff; font-family: 'Jua', sans-serif; touch-action: none; }
  body { background: radial-gradient(circle at 50% 0%, #4b2a7a 0%, #241544 45%, #140b26 100%); }
  .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; padding: calc(10px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom)); gap: 10px; }
  .top { width: 100%; max-width: 520px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .top button { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.25); color: #fff; border-radius: 999px; padding: 7px 14px; font-family: inherit; font-size: 15px; cursor: pointer; }
  .title { font-size: 22px; color: #ffd86b; text-shadow: 0 2px 0 #9a4a00; letter-spacing: 1px; }
  .hud { width: 100%; max-width: 520px; display: flex; gap: 8px; }
  .box { flex: 1; background: rgba(0,0,0,.28); border: 2px solid rgba(255,255,255,.15); border-radius: 16px; padding: 6px 10px; text-align: center; }
  .box .k { font-size: 12px; color: #c9b8f0; }
  .box .v { font-size: 26px; line-height: 1.1; }
  #score { color: #ffe27a; }
  .timebar { width: 100%; max-width: 520px; height: 14px; background: rgba(0,0,0,.35); border-radius: 999px; overflow: hidden; border: 2px solid rgba(255,255,255,.15); }
  #timeFill { height: 100%; width: 100%; background: linear-gradient(90deg, #ff6b8b, #ffd86b, #6bffb0); border-radius: 999px; transition: width .2s linear; }
  #timeFill.low { animation: blink .5s infinite alternate; }
  @keyframes blink { to { opacity: .45; } }

  #board { position: relative; background: rgba(0,0,0,.3); border: 3px solid rgba(255,255,255,.18); border-radius: 18px; box-shadow: inset 0 0 30px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35); }
  .tile { position: absolute; transition: transform .2s ease; will-change: transform; }
  .tile .gem { position: absolute; inset: 7%; border-radius: 26%; overflow: hidden; background-size: cover; background-position: center;
    box-shadow: 0 0 0 3px var(--c), 0 4px 0 2px rgba(0,0,0,.35), inset 0 0 0 2px rgba(255,255,255,.35); transition: transform .15s; }
  .tile .gem::after { content: ''; position: absolute; left: 10%; top: 6%; width: 45%; height: 25%; border-radius: 50%; background: rgba(255,255,255,.35); filter: blur(2px); }
  .tile.rare .gem { box-shadow: 0 0 0 3px #ffd86b, 0 0 0 5px #b8860b, 0 4px 0 4px rgba(0,0,0,.35), 0 0 14px 3px rgba(255,216,107,.7); }
  .tile.rare::after { content: '✨'; position: absolute; right: 2%; top: -4%; font-size: calc(var(--s, 48px) * .3); pointer-events: none; }
  .stage-tag { font-size: 13px; color: #ffd86b; margin-top: 2px; }
  .tile.sel .gem { transform: scale(1.12); box-shadow: 0 0 0 4px #fff, 0 0 18px 4px var(--c); }
  .tile.pop .gem { animation: pop .28s ease-in forwards; }
  @keyframes pop { 50% { transform: scale(1.3); filter: brightness(1.8); } 100% { transform: scale(0); opacity: 0; } }
  .tile.hint .gem { animation: wiggle .6s ease-in-out infinite; }
  @keyframes wiggle { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-12deg) scale(1.08); } 75% { transform: rotate(12deg) scale(1.08); } }
  #fx { position: absolute; left: -30px; top: -30px; pointer-events: none; z-index: 4; }
  .float { position: absolute; pointer-events: none; font-size: 22px; color: #fff; text-shadow: 0 2px 0 #7a2b8a, 0 0 8px #ff7ad9; animation: up .8s ease-out forwards; z-index: 5; white-space: nowrap; }
  @keyframes up { to { transform: translateY(-40px); opacity: 0; } }
  #combo { position: absolute; left: 50%; top: 40%; transform: translate(-50%,-50%) scale(0); font-size: 40px; color: #ffd86b; text-shadow: 0 3px 0 #9a4a00, 0 0 20px #ff9a3c; pointer-events: none; z-index: 6; }
  #combo.on { animation: comboIn .7s ease-out forwards; }
  @keyframes comboIn { 0% { transform: translate(-50%,-50%) scale(.3); opacity: 0; } 30% { transform: translate(-50%,-50%) scale(1.15); opacity: 1; } 100% { transform: translate(-50%,-70%) scale(1); opacity: 0; } }

  .overlay { position: fixed; inset: 0; background: rgba(15,8,30,.82); display: none; align-items: center; justify-content: center; z-index: 20; padding: 20px; backdrop-filter: blur(4px); }
  .overlay.on { display: flex; }
  .card { width: 100%; max-width: 380px; background: linear-gradient(180deg, #3b2468, #24163f); border: 2px solid rgba(255,216,107,.5); border-radius: 24px; padding: 22px 20px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,.5); }
  .card h2 { font-size: 30px; color: #ffd86b; text-shadow: 0 2px 0 #9a4a00; margin-bottom: 6px; }
  .card p { color: #ddd0f7; font-size: 15px; line-height: 1.6; }
  .gems-preview { display: flex; gap: 6px; justify-content: center; margin: 14px 0; flex-wrap: wrap; }
  .gems-preview div { width: 42px; height: 42px; border-radius: 12px; background-size: cover; background-position: center; box-shadow: 0 0 0 3px var(--c); }
  .gems-preview div.rare { box-shadow: 0 0 0 3px #ffd86b, 0 0 10px 2px rgba(255,216,107,.8); }
  .big { margin-top: 14px; width: 100%; padding: 14px; font-family: inherit; font-size: 22px; border: none; border-radius: 16px; cursor: pointer; color: #3a1d00;
    background: linear-gradient(180deg, #ffe27a, #ffb347); box-shadow: 0 5px 0 #b86a00; }
  .big:disabled { opacity: .45; filter: grayscale(.5); }
  .big:active { transform: translateY(3px); box-shadow: 0 2px 0 #b86a00; }
  .ghost { margin-top: 10px; background: none; border: none; color: #c9b8f0; font-family: inherit; font-size: 16px; cursor: pointer; }
  .final { font-size: 54px; color: #ffe27a; margin: 6px 0; text-shadow: 0 3px 0 #9a4a00; }
  .reward { margin-top: 8px; padding: 8px; border-radius: 12px; background: rgba(107,255,176,.12); color: #8dffc4; font-size: 15px; }
  .loading { color: #c9b8f0; font-size: 16px; }
  .card { max-height: 94vh; overflow-y: auto; }
  /* 🏆 순위표 */
  .rank { margin-top: 14px; padding: 10px; border-radius: 16px; background: rgba(0,0,0,.25); border: 1px solid rgba(255,216,107,.25); text-align: left; display: none; }
  .rank.on { display: block; }
  .rk-title { text-align: center; color: #ffd86b; font-size: 17px; margin-bottom: 6px; }
  .rk-tabs { display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; margin-bottom: 6px; }
  .rk-tabs button { font-family: inherit; font-size: 13px; padding: 4px 10px; border-radius: 99px; border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.06); color: #ddd0f7; cursor: pointer; }
  .rk-tabs button.on { background: #ffd86b; color: #3a1d00; border-color: #ffd86b; }
  .rk-list { max-height: 210px; overflow-y: auto; }
  .rk-row { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 10px; font-size: 15px; color: #f1e9ff; }
  .rk-row:nth-child(odd) { background: rgba(255,255,255,.04); }
  .rk-row.me { background: rgba(255,216,107,.22); color: #fff3c4; }
  .rk-row .n { width: 26px; text-align: center; flex-shrink: 0; }
  .rk-row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rk-row .sc { color: #ffe27a; }
  .rk-me, .rk-empty { text-align: center; font-size: 13px; color: #c9b8f0; margin-top: 6px; line-height: 1.5; }
  .rk-me b { color: #ffe27a; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <button onclick="goGallery()">← Gallery</button>
    <div class="title">J.J 아트퐁</div>
    <button id="soundBtn" onclick="toggleSound()">🔊</button>
  </div>
  <div class="hud">
    <div class="box"><div class="k">점수</div><div class="v" id="score">0</div></div>
    <div class="box"><div class="k">남은 시간</div><div class="v" id="time">60</div></div>
    <div class="box"><div class="k">최고 점수</div><div class="v" id="best">0</div></div>
  </div>
  <div class="timebar"><div id="timeFill"></div></div>
  <div id="board"><canvas id="fx"></canvas><div id="combo"></div></div>
</div>

<div class="overlay on" id="startOv">
  <div class="card">
    <h2>J.J 아트퐁</h2>
    <div class="stage-tag" id="stageTag"></div>
    <p>같은 그림을 <b>3개 이상</b> 가로·세로로 맞추면 팡!<br>그림을 밀거나 두 칸을 차례로 누르면 자리가 바뀌어요.<br>4개 이상 맞추면 ⏱ +2초, 연달아 터지면 콤보!</p>
    <div class="gems-preview" id="preview"><span class="loading">그림을 불러오는 중…</span></div>
    <button class="big" id="startBtn" onclick="startGame()" disabled>게임 시작</button>
    <button class="ghost" id="needTicket" style="display:none" onclick="location.href='./?open=pang'">💧 페인트로 입장권 받으러 가기</button>
    <div class="rank" id="rankStart"></div>
    <p style="margin-top:10px; font-size:11px; color:#9d8cc4">© J.J All rights reserved · 그림의 저작권은 작가 JJ에게 있어요</p>
  </div>
</div>

<div class="overlay" id="endOv">
  <div class="card">
    <h2>시간 끝!</h2>
    <div class="final" id="finalScore">0</div>
    <p id="endMsg"></p>
    <div class="reward" id="rewardMsg" style="display:none"></div>
    <div class="rank" id="rankEnd"></div>
    <button class="big" id="againBtn" onclick="playAgain()">한 판 더!</button>
    <button class="ghost" onclick="goGallery()">갤러리로 돌아가기</button>
  </div>
</div>

<script>
  const USERNAME = 'hannaj1763-sketch', REPO = 'gallery2026';
  const N = 7, GAME_SEC = 60;
  const COLORS = ['#ff6b8b', '#ffd86b', '#6bd5ff', '#8dff8a', '#c58bff', '#ff9a4d', '#6bffe0'];
  const K_BEST = 'agjj_pang_best', K_PENDING = 'agjj_pending_paint', K_TICKET = 'agjj_pang_ticket';
  const rawUrl = p => `https://raw.githubusercontent.com/${USERNAME}/${REPO}/main/` + p.split('/').map(encodeURIComponent).join('/');
  const $ = id => document.getElementById(id);
  const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
               set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
  const IS_APP = !!(window.AtelierApp || (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()));

  let ART = [];                // 보석으로 쓸 그림 {src, c, rare}
  let STAGE = { n: 1, mult: 1, target: 3000, ids: null };   // 입장권에서 받은 단계 정보
  let grid = [];               // grid[r][c] = {t: 종류, el}
  let size = 48, busy = false, playing = false, score = 0, timeLeft = GAME_SEC, timer = null, combo = 0, sel = null, hintTimer = null;

  // ----- 그림 불러오기 -----
  async function loadArt() {
    let ids = [], rare = [];
    if (STAGE.ids) { ids = STAGE.ids.lobby.slice(); rare = STAGE.ids.rare.slice(); }
    else { try { const cfg = await (await fetch('exhibitions.json', { cache: 'no-store' })).json(); ids = (cfg.lobby || []).slice(0, 6); } catch (e) {} }
    let tree = [];
    try {
      const r = await fetch(`https://api.github.com/repos/${USERNAME}/${REPO}/git/trees/main?recursive=1`);
      if (r.ok) tree = (await r.json()).tree || [];
    } catch (e) {}
    if (!tree.length) {
      try {
        const d = await (await fetch(`https://data.jsdelivr.com/v1/packages/gh/${USERNAME}/${REPO}@main?structure=flat`)).json();
        tree = (d.files || []).map(f => ({ path: String(f.name).replace(/^\//, '') }));
      } catch (e) {}
    }
    const imgOf = {};
    tree.forEach(t => { const p = t.path.split('/'); if (p.length === 3 && p[0] === 'artworks' && /\.(jpe?g|png|webp)$/i.test(p[2]) && !imgOf[p[1]]) imgOf[p[1]] = t.path; });
    if (ids.length < 6) ids = ids.concat(Object.keys(imgOf).filter(k => k !== '01' && !ids.includes(k)).sort());
    ids = ids.filter(id => imgOf[id]).slice(0, 6);
    ART = ids.map((id, i) => ({ src: rawUrl(imgOf[id]), c: COLORS[i], rare: false }))
      .concat(rare.filter(id => imgOf[id]).map(id => ({ src: rawUrl(imgOf[id]), c: '#ffd86b', rare: true })));
    await Promise.all(ART.map(a => new Promise(res => { const im = new Image(); im.onload = im.onerror = res; im.src = a.src; })));
    $('preview').innerHTML = ART.map(a => `<div class="${a.rare ? 'rare' : ''}" style="background-image:url('${a.src}'); --c:${a.c}"></div>`).join('');
    if (ART.length >= 4 && ticketOk) $('startBtn').disabled = false;
    else $('preview').innerHTML = '<span class="loading">그림을 불러오지 못했어요. 잠시 뒤 다시 열어 주세요.</span>';
  }

  // ----- 판 만들기 -----
  function layout() {
    const w = Math.min(innerWidth - 24, 520), h = innerHeight - 220;
    size = Math.floor(Math.min(w, h) / N);
    $('board').style.width = $('board').style.height = (size * N + 6) + 'px';
    sizeFx();
    grid.forEach((row, r) => row.forEach((t, c) => t && place(t, r, c)));
  }
  addEventListener('resize', layout);
  function place(t, r, c) { t.el.style.width = t.el.style.height = size + 'px'; t.el.style.transform = `translate(${c * size}px, ${r * size}px)`; }
  function makeTile(type, r, c, fromRow) {
    const el = document.createElement('div');
    el.className = 'tile' + (ART[type].rare ? ' rare' : '');
    el.innerHTML = `<div class="gem" style="background-image:url('${ART[type].src}'); --c:${ART[type].c}"></div>`;
    const t = { t: type, el };
    el.style.width = el.style.height = size + 'px'; el.style.setProperty('--s', size + 'px');
    el.style.transform = `translate(${c * size}px, ${(fromRow ?? r) * size}px)`;
    $('board').appendChild(el);
    return t;
  }
  function randType(r, c) {
    // 처음부터 3개가 붙어 있지 않게
    for (let i = 0; i < 20; i++) {
      const k = Math.floor(Math.random() * ART.length);
      if (c >= 2 && grid[r][c - 1] && grid[r][c - 2] && grid[r][c - 1].t === k && grid[r][c - 2].t === k) continue;
      if (r >= 2 && grid[r - 1][c] && grid[r - 2][c] && grid[r - 1][c].t === k && grid[r - 2][c].t === k) continue;
      return k;
    }
    return Math.floor(Math.random() * ART.length);
  }
  function newBoard() {
    $('board').querySelectorAll('.tile').forEach(e => e.remove());
    grid = Array.from({ length: N }, () => Array(N).fill(null));
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) grid[r][c] = makeTile(randType(r, c), r, c);
    if (!findMove()) newBoard();
  }

  // ----- 맞추기 -----
  function findMatches() {
    const hit = new Set(), groups = [];
    for (let r = 0; r < N; r++) for (let c = 0; c < N;) {
      let k = c; while (k < N && grid[r][k] && grid[r][c] && grid[r][k].t === grid[r][c].t) k++;
      if (k - c >= 3) { groups.push(k - c); for (let i = c; i < k; i++) hit.add(r * N + i); }
      c = Math.max(k, c + 1);
    }
    for (let c = 0; c < N; c++) for (let r = 0; r < N;) {
      let k = r; while (k < N && grid[k][c] && grid[r][c] && grid[k][c].t === grid[r][c].t) k++;
      if (k - r >= 3) { groups.push(k - r); for (let i = r; i < k; i++) hit.add(i * N + c); }
      r = Math.max(k, r + 1);
    }
    return { hit, groups };
  }
  function swapCells(a, b) {
    const t = grid[a.r][a.c]; grid[a.r][a.c] = grid[b.r][b.c]; grid[b.r][b.c] = t;
    place(grid[a.r][a.c], a.r, a.c); place(grid[b.r][b.c], b.r, b.c);
  }
  const wait = ms => new Promise(r => setTimeout(r, ms));
  async function trySwap(a, b) {
    if (busy || !playing) return;
    if (Math.abs(a.r - b.r) + Math.abs(a.c - b.c) !== 1) return;
    busy = true; clearHint();
    swapCells(a, b); sfx('swap');
    await wait(210);
    if (!findMatches().hit.size) { swapCells(a, b); sfx('no'); await wait(210); busy = false; armHint(); return; }
    combo = 0;
    await resolve();
    busy = false;
    if (!findMove()) await shuffle();
    armHint();
  }
  async function resolve() {
    while (true) {
      const { hit, groups } = findMatches();
      if (!hit.size) break;
      combo++;
      let rareN = 0; hit.forEach(i => { const r = Math.floor(i / N), c = i % N; if (ART[grid[r][c].t].rare) rareN++; });
      const gained = Math.round(((hit.size + rareN) * 10 * combo + groups.filter(n => n >= 4).length * 50) * STAGE.mult);   // ✨레어 보석은 2배
      score += gained; $('score').innerText = score.toLocaleString();
      if (groups.some(n => n >= 4) && playing) { timeLeft = Math.min(GAME_SEC, timeLeft + 2); floatText('⏱ +2초', size * N / 2, size * 0.6); }
      if (combo >= 2) showCombo(combo);
      let sx = 0, sy = 0;
      hit.forEach(i => { const r = Math.floor(i / N), c = i % N; sx += c; sy += r; grid[r][c].el.classList.add('pop');
        const a = ART[grid[r][c].t]; splash((c + .5) * size, (r + .5) * size, a.rare ? '#ffd23f' : a.c, a.rare); });
      if (hit.size >= 4 || combo >= 2) floatText('퐁!', (sx / hit.size - .3) * size, (sy / hit.size - .6) * size);
      floatText('+' + gained, (sx / hit.size + .2) * size, (sy / hit.size) * size);
      sfx('pop', combo);
      await wait(280);
      hit.forEach(i => { const r = Math.floor(i / N), c = i % N; grid[r][c].el.remove(); grid[r][c] = null; });
      // 떨어뜨리고 새로 채우기
      for (let c = 0; c < N; c++) {
        let w = N - 1;
        for (let r = N - 1; r >= 0; r--) if (grid[r][c]) { const t = grid[r][c]; grid[r][c] = null; grid[w][c] = t; place(t, w, c); w--; }
        for (let r = w, k = 1; r >= 0; r--, k++) { const t = makeTile(Math.floor(Math.random() * ART.length), r, c, -k); grid[r][c] = t; }
      }
      await wait(30);
      for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) place(grid[r][c], r, c);
      await wait(240);
    }
  }
  function findMove() {
    const dirs = [[0, 1], [1, 0]];
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) for (const [dr, dc] of dirs) {
      const r2 = r + dr, c2 = c + dc; if (r2 >= N || c2 >= N) continue;
      let t = grid[r][c]; grid[r][c] = grid[r2][c2]; grid[r2][c2] = t;
      const ok = findMatches().hit.size > 0;
      t = grid[r][c]; grid[r][c] = grid[r2][c2]; grid[r2][c2] = t;
      if (ok) return [{ r, c }, { r: r2, c: c2 }];
    }
    return null;
  }
  async function shuffle() {
    floatText('섞는 중!', size * N / 2 - 30, size * N / 2);
    await wait(400);
    for (let i = 0; i < 30; i++) {
      const all = grid.flat().map(t => t.t).sort(() => Math.random() - .5);
      grid.forEach((row, r) => row.forEach((t, c) => { t.t = all[r * N + c]; t.el.querySelector('.gem').style.backgroundImage = `url('${ART[t.t].src}')`; t.el.querySelector('.gem').style.setProperty('--c', ART[t.t].c); t.el.classList.toggle('rare', !!ART[t.t].rare); }));
      if (!findMatches().hit.size && findMove()) return;
    }
    newBoard();
  }

  // ----- 힌트 (3초 동안 가만히 있으면) -----
  function clearHint() { clearTimeout(hintTimer); document.querySelectorAll('.tile.hint').forEach(e => e.classList.remove('hint')); }
  function armHint() { clearHint(); if (!playing) return; hintTimer = setTimeout(() => { const m = findMove(); if (m) m.forEach(p => grid[p.r][p.c].el.classList.add('hint')); }, 3000); }

  // ----- 손가락·마우스 -----
  let down = null;
  function cellAt(e) {
    const b = $('board').getBoundingClientRect(), p = e.touches ? e.touches[0] : e;
    const c = Math.floor((p.clientX - b.left - 3) / size), r = Math.floor((p.clientY - b.top - 3) / size);
    return r >= 0 && r < N && c >= 0 && c < N ? { r, c, x: p.clientX, y: p.clientY } : null;
  }
  function onDown(e) { e.preventDefault(); if (!playing || busy) return; down = cellAt(e); }
  function onMove(e) {
    if (!down) return;
    const p = e.touches ? e.touches[0] : e, dx = p.clientX - down.x, dy = p.clientY - down.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < size * 0.35) return;
    const to = Math.abs(dx) > Math.abs(dy) ? { r: down.r, c: down.c + Math.sign(dx) } : { r: down.r + Math.sign(dy), c: down.c };
    const from = down; down = null; setSel(null);
    if (to.r >= 0 && to.r < N && to.c >= 0 && to.c < N) trySwap(from, to);
  }
  function onUp() {
    if (!down) return;
    const d = down; down = null;
    if (sel && Math.abs(sel.r - d.r) + Math.abs(sel.c - d.c) === 1) { const s = sel; setSel(null); trySwap(s, d); }
    else setSel(sel && sel.r === d.r && sel.c === d.c ? null : d);
  }
  function setSel(p) {
    if (sel && grid[sel.r][sel.c]) grid[sel.r][sel.c].el.classList.remove('sel');
    sel = p; if (p) grid[p.r][p.c].el.classList.add('sel');
  }
  const B = $('board');
  B.addEventListener('touchstart', onDown, { passive: false }); B.addEventListener('mousedown', onDown);
  addEventListener('touchmove', onMove, { passive: false }); addEventListener('mousemove', onMove);
  addEventListener('touchend', onUp); addEventListener('mouseup', onUp);

  // ----- 효과 -----

  // ----- 🎨 페인트 퐁! 효과 (보석 색깔 물감이 터져 튀는 효과) -----
  const FX = $('fx'), fctx = FX.getContext('2d'), PAD = 30; let parts = [], splats = [], fxOn = false;
  function sizeFx() { const d = devicePixelRatio || 1, w = size * N + PAD * 2; FX.width = FX.height = w * d; FX.style.width = FX.style.height = w + 'px'; fctx.setTransform(d, 0, 0, d, 0, 0); }
  function splash(x, y, col, rare) {
    x += PAD; y += PAD;
    // 바닥에 남는 얼룩: 울퉁불퉁한 물감 자국
    const pts = [], n = 9 + (Math.random() * 4 | 0), R = size * (rare ? .42 : .34);
    for (let k = 0; k < n; k++) pts.push(R * (.65 + Math.random() * .55));
    splats.push({ x, y, col, pts, rot: Math.random() * 6.28, t: 0, life: 650, grow: 0 });
    // 튀는 물방울
    const m = rare ? 16 : 10;
    for (let k = 0; k < m; k++) {
      const ang = Math.random() * 6.28, sp = size * (.06 + Math.random() * .12);
      parts.push({ x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - size * .05, r: size * (.04 + Math.random() * .07), col: rare && k % 3 === 0 ? '#fff6c2' : col, t: 0, life: 520 + Math.random() * 300 });
    }
    if (!fxOn) { fxOn = true; last = performance.now(); requestAnimationFrame(fxLoop); }
  }
  let last = 0;
  function blob(s) {
    const n = s.pts.length; fctx.beginPath();
    for (let k = 0; k <= n; k++) {
      const a = s.rot + k / n * 6.28, r = s.pts[k % n] * s.grow, a2 = s.rot + (k + .5) / n * 6.28, r2 = s.pts[k % n] * s.grow * .78;
      const X = s.x + Math.cos(a) * r, Y = s.y + Math.sin(a) * r;
      if (!k) fctx.moveTo(X, Y); else fctx.quadraticCurveTo(s.x + Math.cos(a2 - 6.28 / n) * r2 * 1.15, s.y + Math.sin(a2 - 6.28 / n) * r2 * 1.15, X, Y);
    }
    fctx.closePath(); fctx.fill();
  }
  function fxLoop(now) {
    const dt = Math.min(40, now - last); last = now;
    fctx.clearRect(0, 0, FX.width, FX.height);
    splats = splats.filter(s => (s.t += dt) < s.life);
    splats.forEach(s => {
      s.grow = Math.min(1, s.t / 90); fctx.globalAlpha = .85 * (1 - Math.max(0, (s.t - 250) / (s.life - 250)));
      fctx.fillStyle = s.col; blob(s);
      fctx.globalAlpha *= .45; fctx.fillStyle = '#fff'; fctx.beginPath(); fctx.arc(s.x - s.pts[0] * .3, s.y - s.pts[0] * .3, s.pts[0] * .18 * s.grow, 0, 6.28); fctx.fill();
    });
    parts = parts.filter(p => (p.t += dt) < p.life);
    parts.forEach(p => {
      const f = dt / 16; p.vy += size * .009 * f; p.x += p.vx * f; p.y += p.vy * f; p.vx *= .97;
      const k = 1 - p.t / p.life; fctx.globalAlpha = Math.min(1, k * 1.6); fctx.fillStyle = p.col;
      fctx.beginPath(); fctx.ellipse(p.x, p.y, p.r * (.6 + k * .4), p.r * (.6 + k * .4) * (1 + Math.min(.8, Math.abs(p.vy) / size * 3)), Math.atan2(p.vy, p.vx) - 1.57, 0, 6.28); fctx.fill();
    });
    fctx.globalAlpha = 1;
    if (splats.length || parts.length) requestAnimationFrame(fxLoop); else { fxOn = false; fctx.clearRect(0, 0, FX.width, FX.height); }
  }
  function floatText(t, x, y) { const d = document.createElement('div'); d.className = 'float'; d.innerText = t; d.style.left = x + 'px'; d.style.top = y + 'px'; B.appendChild(d); setTimeout(() => d.remove(), 800); }
  function showCombo(n) { const e = $('combo'); e.innerText = `${n} 콤보!`; e.classList.remove('on'); void e.offsetWidth; e.classList.add('on'); }
  let ac = null, soundOn = ls.get('agjj_pang_sound', true);
  $('soundBtn').innerText = soundOn ? '🔊' : '🔇';
  function toggleSound() { soundOn = !soundOn; ls.set('agjj_pang_sound', soundOn); $('soundBtn').innerText = soundOn ? '🔊' : '🔇'; }
  function sfx(kind, n = 1) {
    if (!soundOn) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
      const f = { swap: 420, no: 180, pop: 520 + Math.min(n, 8) * 90, end: 300 }[kind];
      o.type = kind === 'no' ? 'square' : 'sine'; o.frequency.setValueAtTime(f, t);
      if (kind === 'pop') o.frequency.exponentialRampToValueAtTime(f * 1.8, t + .12);
      g.gain.setValueAtTime(.12, t); g.gain.exponentialRampToValueAtTime(.001, t + (kind === 'pop' ? .2 : .12));
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + .25);
    } catch (e) {}
  }

  // ----- 게임 진행 -----
  function startGame() {
    if (!ticketOk) return;
    if (IS_APP) { try { localStorage.removeItem(K_TICKET); } catch (e) {} ticketOk = false; }   // 입장권 1장 = 1판
    $('startOv').classList.remove('on'); $('endOv').classList.remove('on');
    score = 0; timeLeft = GAME_SEC; combo = 0; busy = false; sel = null;
    $('score').innerText = '0'; $('best').innerText = ls.get(K_BEST + '_' + STAGE.n, 0).toLocaleString();
    layout(); newBoard(); playing = true; armHint();
    clearInterval(timer);
    timer = setInterval(() => {
      timeLeft -= 0.2;
      $('time').innerText = Math.max(0, Math.ceil(timeLeft));
      $('timeFill').style.width = Math.max(0, timeLeft / GAME_SEC * 100) + '%';
      $('timeFill').classList.toggle('low', timeLeft <= 10);
      if (timeLeft <= 0) endGame();
    }, 200);
  }
  async function endGame() {
    clearInterval(timer); playing = false; clearHint(); setSel(null);
    while (busy) await wait(100);              // 터지는 중이면 끝날 때까지
    sfx('end');
    const bk = K_BEST + '_' + STAGE.n, best = ls.get(bk, 0), isBest = score > best;
    if (isBest) ls.set(bk, score);
    $('best').innerText = Math.max(best, score).toLocaleString();
    $('finalScore').innerText = score.toLocaleString();
    $('endMsg').innerText = isBest ? '🎉 새 최고 점수예요!' : `최고 점수 ${best.toLocaleString()}점`;
    // 💧 목표 점수를 넘기면 페인트 1개 돌려받기
    const rm = $('rewardMsg'); rm.style.display = 'none';
    if (IS_APP) {
      if (score >= STAGE.target) { ls.set(K_PENDING, ls.get(K_PENDING, 0) + 1); rm.innerText = `🎯 목표 ${STAGE.target.toLocaleString()}점 달성! 💧 1개를 돌려받았어요`; }
      else rm.innerText = `🎯 목표 ${STAGE.target.toLocaleString()}점을 넘기면 💧 1개를 돌려받아요`;
      rm.style.display = 'block';
    }
    $('againBtn').innerText = IS_APP ? '💧 1개로 한 판 더!' : '한 판 더!';
    $('endOv').classList.add('on');
    submitScore(score);
  }

  // =====================================================================
  // 🏆 순위표 (앱 + 로그인한 사람만) — Firestore
  //   pong/s{단계}/all/{uid}         역대 최고 점수
  //   pong/s{단계}/w{월요일날짜}/{uid}  이번 주 최고 점수 (매주 월요일 0시, 한국 시간에 새로 시작)
  //   이름은 닉네임만 보여요 (구글 실명 X)
  // =====================================================================
  const FIREBASE_CONFIG = { apiKey: "AIzaSyBwlcopOmwqdoZZcXwVIDOPtds85xTJfRM", authDomain: "agjj-adb63.firebaseapp.com", projectId: "agjj-adb63",
    storageBucket: "agjj-adb63.firebasestorage.app", messagingSenderId: "83235290466", appId: "1:83235290466:web:56aec1eebc3eae0a11403b" };
  const FB_VER = '10.14.1', K_NICK = 'agjj_nick_v1', RANK_TOP = 10;
  const escH = t => String(t || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  function weekKey() { const d = new Date(Date.now() + 9 * 3600e3); d.setUTCDate(d.getUTCDate() - (d.getUTCDay() + 6) % 7); return 'w' + d.toISOString().slice(0, 10).replace(/-/g, ''); }
  let fbP = null;
  function fbReady() {
    if (!IS_APP) return Promise.resolve(null);
    if (!fbP) fbP = (async () => {
      const base = `https://www.gstatic.com/firebasejs/${FB_VER}/`;
      const [appM, authM, fsM] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
      const app = appM.initializeApp(FIREBASE_CONFIG);
      const auth = authM.initializeAuth(app, { persistence: [authM.indexedDBLocalPersistence, authM.browserLocalPersistence] });
      const user = await new Promise(res => { const off = authM.onAuthStateChanged(auth, u => { off(); res(u); }); });
      if (!user) return null;
      return { user, db: fsM.getFirestore(app), ...fsM };
    })().catch(e => { console.log('순위표를 불러오지 못했어요:', e); return null; });
    return fbP;
  }
  const rankCol = (f, n, per) => f.collection(f.db, 'pong', 's' + n, per);

  // 내 점수 올리기 (그 기간 내 최고보다 높을 때만)
  let lastSubmit = null;
  async function submitScore(sc) {
    const box = $('rankEnd');
    const f = await fbReady();
    if (!f) { box.classList.remove('on'); return; }
    const nick = ls.get(K_NICK, '');
    box.classList.add('on');
    if (!nick) { box.innerHTML = '<div class="rk-empty">🏷 닉네임을 정하면 순위표에 올라가요.<br>갤러리 → 👤 My → ✏️ 닉네임</div>'; return; }
    box.innerHTML = '<div class="rk-empty">🏆 순위 확인 중…</div>';
    const up = {};
    for (const per of ['all', weekKey()]) {
      try {
        const ref = f.doc(rankCol(f, STAGE.n, per), f.user.uid), sn = await f.getDoc(ref);
        if (sc > 0 && (!sn.exists() || sc > (sn.data().score || 0))) { await f.setDoc(ref, { nick, score: sc, at: Date.now() }); up[per === 'all' ? 'all' : 'week'] = true; }
      } catch (e) { console.log('점수를 올리지 못했어요:', e); }
    }
    lastSubmit = up;
    rankUI('rankEnd', { stage: STAGE.n, per: 'week', chips: false });
  }

  // 순위표 그리기  opt: { stage, per: 'week'|'all', chips: 단계 고르기 보이기 }
  const rankState = {};
  async function rankUI(id, opt) {
    const box = $(id), st = rankState[id] = { ...(rankState[id] || {}), ...opt };
    const f = await fbReady();
    if (!f) { box.classList.remove('on'); return; }
    box.classList.add('on');
    const per = st.per === 'all' ? 'all' : weekKey();
    const chips = st.chips ? [1, 2, 3, 4].map(n => `<button class="${n === st.stage ? 'on' : ''}" onclick="rankUI('${id}', {stage:${n}})">${n}단계</button>`).join('') : '';
    box.innerHTML = `<div class="rk-title">🏆 ${st.chips ? '' : st.stage + '단계 '}순위</div>
      ${chips ? `<div class="rk-tabs">${chips}</div>` : ''}
      <div class="rk-tabs"><button class="${st.per !== 'all' ? 'on' : ''}" onclick="rankUI('${id}', {per:'week'})">이번 주</button><button class="${st.per === 'all' ? 'on' : ''}" onclick="rankUI('${id}', {per:'all'})">역대</button></div>
      <div class="rk-list"><div class="rk-empty">불러오는 중…</div></div><div class="rk-me"></div>`;
    try {
      const col = rankCol(f, st.stage, per);
      const top = await f.getDocs(f.query(col, f.orderBy('score', 'desc'), f.limit(RANK_TOP)));
      if (rankState[id] !== st) return;            // 그새 다른 탭을 눌렀으면 그만
      const rows = top.docs.map((d, i) => { const v = d.data(); const n = i < 3 ? ['🥇', '🥈', '🥉'][i] : i + 1;
        return `<div class="rk-row ${d.id === f.user.uid ? 'me' : ''}"><span class="n">${n}</span><span class="nm">${escH(v.nick)}</span><span class="sc">${Number(v.score || 0).toLocaleString()}</span></div>`; }).join('');
      box.querySelector('.rk-list').innerHTML = rows || `<div class="rk-empty">${st.per === 'all' ? '아직 기록이 없어요.' : '이번 주 첫 기록의 주인공이 되어 보세요!'}</div>`;
      const mine = await f.getDoc(f.doc(col, f.user.uid));
      let me = '';
      if (mine.exists()) {
        const my = mine.data().score || 0;
        const above = (await f.getCountFromServer(f.query(col, f.where('score', '>', my)))).data().count;
        const isNew = id === 'rankEnd' && lastSubmit && lastSubmit[st.per === 'all' ? 'all' : 'week'];
        me = `${isNew ? '🎉 순위표 기록 갱신! ' : ''}내 ${st.per === 'all' ? '역대' : '이번 주'} 최고 <b>${my.toLocaleString()}점</b> · <b>${above + 1}위</b>`;
      } else me = ls.get(K_NICK, '') ? '아직 내 기록이 없어요. 한 판 하면 올라가요!' : '🏷 닉네임을 정하면 순위표에 올라가요 (My → ✏️ 닉네임)';
      if (rankState[id] === st) box.querySelector('.rk-me').innerHTML = me;
    } catch (e) {
      console.log('순위표 오류:', e);
      if (rankState[id] === st) box.querySelector('.rk-list').innerHTML = '<div class="rk-empty">순위표를 불러오지 못했어요. 잠시 뒤 다시 열어 주세요.</div>';
    }
  }
  function goGallery() { location.href = './'; }
  function playAgain() { if (IS_APP) location.href = './?open=pang'; else startGame(); }

  // ----- 입장권 확인 (앱: 💧 1개로 받은 입장권이 있어야 시작) -----
  let ticketOk = !IS_APP;
  (function readTicket() {
    const tk = ls.get(K_TICKET, null);
    if (IS_APP && tk && Date.now() - tk.t < 15 * 60 * 1000) { ticketOk = true; }
    if (tk && (ticketOk || !IS_APP) && tk.stage) STAGE = { n: tk.stage, mult: tk.mult || 1, target: tk.target || 3000, ids: tk.ids };
    if (!IS_APP) STAGE = { n: 1, mult: 1, target: 3000, ids: null };          // 웹은 1단계만
    $('stageTag').innerText = `${STAGE.n}단계 · 점수 ×${STAGE.mult}` + (IS_APP ? ` · 목표 ${STAGE.target.toLocaleString()}점` : ' · 웹 체험판');
    if (!ticketOk) { $('needTicket').style.display = 'block'; $('startBtn').innerText = '입장권이 필요해요'; }
  })();
  $('best').innerText = ls.get(K_BEST + '_' + STAGE.n, 0).toLocaleString();
  layout();
  loadArt();
  { const q = Number(new URLSearchParams(location.search).get('rank')) || 0;     // ?rank=1 : 순위만 보러 왔을 때
    rankUI('rankStart', { stage: q >= 1 && q <= 4 && !ticketOk ? q : STAGE.n, per: 'week', chips: true }); }
</script>
